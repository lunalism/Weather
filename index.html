<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RaceWeather — Tactical Race Weather Display</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@400;500;600;700&family=Share+Tech+Mono&display=swap"
    rel="stylesheet"
  />

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  />
  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
  ></script>

  <style>
    :root {
      --bg-deep: #020408;
      --bg-panel: rgba(4, 10, 18, 0.78);
      --hud-green: #00ff88;
      --hud-green-dim: rgba(0, 255, 136, 0.35);
      --hud-green-glow: rgba(0, 255, 136, 0.55);
      --hud-amber: #ffaa00;
      --hud-red: #ff3344;
      --hud-cyan: #00ddff;
      --grid-line: rgba(0, 255, 136, 0.08);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg-deep);
      color: var(--hud-green);
      font-family: "Rajdhani", "Share Tech Mono", monospace;
      /* cursor: none; — re-enable in STEP 7 for TV deploy */
    }

    #app {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
    }

    /* ===== MAP ===== */
    #map {
      position: absolute;
      inset: 0;
      background: var(--bg-deep);
      z-index: 1;
    }

    .leaflet-container {
      background: #000;
      font-family: "Share Tech Mono", monospace;
    }

    .leaflet-control-attribution {
      background: rgba(2, 4, 8, 0.7) !important;
      color: rgba(0, 255, 136, 0.5) !important;
      font-size: 9px !important;
      letter-spacing: 0.5px;
    }
    .leaflet-control-attribution a {
      color: var(--hud-green) !important;
    }

    .leaflet-control-zoom a {
      background: var(--bg-panel) !important;
      color: var(--hud-green) !important;
      border: 1px solid var(--hud-green-dim) !important;
      font-family: "Orbitron", sans-serif !important;
      text-shadow: 0 0 6px var(--hud-green-glow);
    }
    .leaflet-control-zoom a:hover {
      background: rgba(0, 255, 136, 0.15) !important;
    }

    /* ===== CIRCUIT MARKERS (pulse) ===== */
    .circuit-marker {
      position: relative;
      width: 18px;
      height: 18px;
    }
    .circuit-marker .core {
      position: absolute;
      inset: 0;
      margin: auto;
      width: 10px;
      height: 10px;
      background: var(--hud-green);
      border-radius: 50%;
      box-shadow:
        0 0 8px var(--hud-green),
        0 0 18px var(--hud-green-glow),
        0 0 32px rgba(0, 255, 136, 0.35);
      z-index: 2;
    }
    .circuit-marker .ring {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 1.5px solid var(--hud-green);
      opacity: 0;
      animation: pulse-ring 2.4s ease-out infinite;
    }
    .circuit-marker .ring.delay {
      animation-delay: 1.2s;
    }

    @keyframes pulse-ring {
      0% {
        transform: scale(0.6);
        opacity: 0.9;
      }
      80% {
        transform: scale(3.5);
        opacity: 0;
      }
      100% {
        transform: scale(3.5);
        opacity: 0;
      }
    }

    /* Marker tooltip */
    .leaflet-tooltip.circuit-tooltip {
      background: var(--bg-panel);
      color: var(--hud-green);
      border: 1px solid var(--hud-green-dim);
      border-radius: 0;
      padding: 4px 10px;
      font-family: "Orbitron", sans-serif;
      font-weight: 700;
      font-size: 11px;
      letter-spacing: 2px;
      text-shadow: 0 0 6px var(--hud-green-glow);
      box-shadow: 0 0 14px rgba(0, 255, 136, 0.18);
    }
    .leaflet-tooltip.circuit-tooltip::before {
      display: none;
    }

    /* ===== HUD OVERLAYS ===== */

    /* Scanlines */
    .scanlines {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 1000;
      background: repeating-linear-gradient(
        to bottom,
        rgba(0, 255, 136, 0.025) 0px,
        rgba(0, 255, 136, 0.025) 1px,
        transparent 1px,
        transparent 3px
      );
      mix-blend-mode: screen;
    }

    /* Vignette */
    .vignette {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 999;
      background: radial-gradient(
        ellipse at center,
        transparent 55%,
        rgba(0, 0, 0, 0.6) 100%
      );
    }

    /* Grid overlay */
    .grid-overlay {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 998;
      background-image:
        linear-gradient(to right, var(--grid-line) 1px, transparent 1px),
        linear-gradient(to bottom, var(--grid-line) 1px, transparent 1px);
      background-size: 80px 80px;
      opacity: 0.6;
    }

    /* Corner brackets */
    .corner-brackets {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 1001;
    }
    .corner-brackets::before,
    .corner-brackets::after,
    .corner-brackets > span::before,
    .corner-brackets > span::after {
      content: "";
      position: absolute;
      width: 28px;
      height: 28px;
      border-color: var(--hud-green);
      filter: drop-shadow(0 0 6px var(--hud-green-glow));
    }
    .corner-brackets::before {
      top: 14px;
      left: 14px;
      border-top: 2px solid;
      border-left: 2px solid;
    }
    .corner-brackets::after {
      top: 14px;
      right: 14px;
      border-top: 2px solid;
      border-right: 2px solid;
    }
    .corner-brackets > span::before {
      bottom: 14px;
      left: 14px;
      border-bottom: 2px solid;
      border-left: 2px solid;
    }
    .corner-brackets > span::after {
      bottom: 14px;
      right: 14px;
      border-bottom: 2px solid;
      border-right: 2px solid;
    }

    /* Top status strip */
    .top-strip {
      position: fixed;
      top: 24px;
      left: 60px;
      right: 60px;
      z-index: 50;
      display: flex;
      justify-content: space-between;
      align-items: stretch;
      gap: 18px;
      padding: 0 22px;
      min-height: 62px;
      background: var(--bg-panel);
      border: 1px solid var(--hud-green-dim);
      backdrop-filter: blur(6px);
      font-family: "Orbitron", sans-serif;
      font-size: 12px;
      text-shadow: 0 0 8px var(--hud-green-glow);
    }
    .top-strip .brand {
      display: flex;
      align-items: center;
      font-weight: 900;
      font-size: 14px;
      letter-spacing: 6px;
      color: var(--hud-green);
      padding-right: 22px;
      border-right: 1px solid var(--hud-green-dim);
    }
    .top-strip .brand .accent {
      color: var(--hud-cyan);
    }

    /* Tabs */
    .tabs {
      display: flex;
      flex: 1;
      align-items: stretch;
      justify-content: center;
      gap: 0;
      overflow: hidden;
    }
    .tab {
      position: relative;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 20px;
      font-family: "Orbitron", sans-serif;
      font-weight: 700;
      font-size: 14px;
      letter-spacing: 2.8px;
      color: rgba(0, 255, 136, 0.32);
      background: transparent;
      border: 0;
      cursor: pointer;
      user-select: none;
      white-space: nowrap;
      transition:
        color 0.3s ease,
        background-color 0.3s ease,
        text-shadow 0.3s ease,
        box-shadow 0.3s ease,
        transform 0.3s ease;
    }
    .tab .flag {
      font-size: 22px;
      line-height: 1;
      filter: saturate(1.15);
      transition: filter 0.3s ease, transform 0.3s ease;
    }

    /* Divider between tabs */
    .tab + .tab::before {
      content: "";
      position: absolute;
      left: 0;
      top: 28%;
      bottom: 28%;
      width: 1px;
      background: var(--hud-green-dim);
      transition: opacity 0.3s ease;
    }

    .tab:hover:not(.active) {
      color: rgba(0, 255, 136, 0.9);
      background: rgba(0, 255, 136, 0.08);
      text-shadow: 0 0 6px var(--hud-green-glow);
    }
    .tab:hover .flag {
      filter: saturate(1.3) brightness(1.1);
    }

    .tab.active {
      color: var(--bg-deep);
      background: var(--hud-green);
      text-shadow: none;
      box-shadow:
        inset 0 0 0 1px rgba(255, 255, 255, 0.2),
        inset 0 -3px 0 0 rgba(0, 0, 0, 0.18),
        0 0 14px rgba(0, 255, 136, 0.55),
        0 0 32px rgba(0, 255, 136, 0.35);
    }
    .tab.active .flag {
      filter: saturate(1.4) brightness(1.05) drop-shadow(0 0 4px rgba(0,0,0,0.3));
      transform: scale(1.08);
    }
    /* Hide dividers touching the active tab */
    .tab.active::before,
    .tab.active + .tab::before {
      opacity: 0;
    }

    .top-strip .right {
      display: flex;
      gap: 18px;
      align-items: center;
      padding-left: 22px;
      border-left: 1px solid var(--hud-green-dim);
      font-family: "Share Tech Mono", monospace;
      font-size: 13px;
      letter-spacing: 2px;
    }
    .live-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 2px 10px;
      border: 1px solid var(--hud-red);
      color: var(--hud-red);
      font-family: "Orbitron", sans-serif;
      font-weight: 700;
      letter-spacing: 3px;
      text-shadow: 0 0 6px rgba(255, 51, 68, 0.7);
    }
    .live-badge::before {
      content: "";
      width: 6px;
      height: 6px;
      background: var(--hud-red);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--hud-red);
      animation: blink 1.4s ease-in-out infinite;
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.25; }
    }

    /* Bottom status bar (placeholder for STEP 6) */
    .bottom-strip {
      position: fixed;
      bottom: 24px;
      left: 60px;
      right: 60px;
      z-index: 50;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 18px;
      background: var(--bg-panel);
      border: 1px solid var(--hud-green-dim);
      backdrop-filter: blur(6px);
      font-family: "Share Tech Mono", monospace;
      font-size: 11px;
      letter-spacing: 2px;
      color: rgba(0, 255, 136, 0.7);
    }
    .bottom-strip {
      gap: 24px;
    }
    .bottom-strip .sep {
      margin: 0 12px;
      color: var(--hud-green-dim);
    }
    .bottom-section {
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .bottom-section.center {
      flex: 1;
      justify-content: center;
    }

    /* Track state */
    .track-state {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      font-family: "Orbitron", sans-serif;
      font-weight: 700;
      font-size: 13px;
      letter-spacing: 3px;
    }
    .track-state-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .track-state.dry .track-state-dot {
      background: var(--hud-green);
      box-shadow:
        0 0 10px var(--hud-green),
        0 0 18px var(--hud-green-glow);
      animation: blink 1.6s ease-in-out infinite;
    }
    .track-state.dry .track-state-text {
      color: var(--hud-green);
      text-shadow: 0 0 6px var(--hud-green-glow);
    }
    .track-state.damp .track-state-dot {
      background: var(--hud-amber);
      box-shadow:
        0 0 10px var(--hud-amber),
        0 0 18px rgba(255, 170, 0, 0.45);
      animation: blink 1s ease-in-out infinite;
    }
    .track-state.damp .track-state-text {
      color: var(--hud-amber);
      text-shadow: 0 0 6px rgba(255, 170, 0, 0.5);
    }
    .track-state.wet .track-state-dot {
      background: var(--hud-red);
      box-shadow:
        0 0 10px var(--hud-red),
        0 0 18px rgba(255, 51, 68, 0.45);
      animation: blink 0.6s ease-in-out infinite;
    }
    .track-state.wet .track-state-text {
      color: var(--hud-red);
      text-shadow: 0 0 6px rgba(255, 51, 68, 0.55);
    }
    .track-state.standby .track-state-dot {
      background: rgba(0, 255, 136, 0.35);
      box-shadow: 0 0 6px var(--hud-green-glow);
      animation: blink 2s ease-in-out infinite;
    }
    .track-state.standby .track-state-text {
      color: rgba(0, 255, 136, 0.45);
      text-shadow: none;
    }

    /* Metric pills */
    .metric {
      display: inline-flex;
      align-items: baseline;
      gap: 7px;
      font-family: "Share Tech Mono", monospace;
      font-size: 12px;
      letter-spacing: 1.5px;
    }
    .metric-label {
      color: rgba(0, 255, 136, 0.5);
      font-size: 10px;
      letter-spacing: 2px;
    }
    .metric-value {
      color: var(--hud-green);
      font-weight: 700;
      text-shadow: 0 0 5px rgba(0, 255, 136, 0.4);
    }
    .metric-value.amber {
      color: var(--hud-amber);
      text-shadow: 0 0 5px rgba(255, 170, 0, 0.5);
    }
    .metric-value.red {
      color: var(--hud-red);
      text-shadow: 0 0 5px rgba(255, 51, 68, 0.55);
    }
    .metric-value.cyan {
      color: var(--hud-cyan);
      text-shadow: 0 0 5px rgba(0, 221, 255, 0.5);
    }
    .metric-value.dim {
      color: rgba(0, 255, 136, 0.4);
      text-shadow: none;
    }

    .coords {
      font-family: "Share Tech Mono", monospace;
      font-size: 11px;
      letter-spacing: 1.5px;
      color: rgba(0, 255, 136, 0.7);
    }
    .coords .label {
      color: rgba(0, 255, 136, 0.45);
      margin-right: 4px;
    }

    /* ===== Left panel: current conditions ===== */
    .panel {
      position: fixed;
      z-index: 40;
      background: var(--bg-panel);
      border: 1px solid var(--hud-green-dim);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      color: var(--hud-green);
      box-shadow:
        0 0 24px rgba(0, 255, 136, 0.08),
        inset 0 0 36px rgba(0, 255, 136, 0.04);
    }
    .panel-left {
      top: 110px;
      bottom: 80px;
      left: 60px;
      width: 340px;
      padding: 22px 20px 18px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .panel-label {
      position: absolute;
      top: -9px;
      left: 18px;
      padding: 0 8px;
      background: var(--bg-deep);
      font-family: "Orbitron", sans-serif;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 4px;
      color: var(--hud-cyan);
      text-shadow: 0 0 6px rgba(0, 221, 255, 0.5);
    }
    .panel-corner {
      position: absolute;
      width: 12px;
      height: 12px;
      border-color: var(--hud-green);
      filter: drop-shadow(0 0 4px var(--hud-green-glow));
      pointer-events: none;
    }
    .panel-corner.tl { top: -1px; left: -1px; border-top: 2px solid; border-left: 2px solid; }
    .panel-corner.tr { top: -1px; right: -1px; border-top: 2px solid; border-right: 2px solid; }
    .panel-corner.bl { bottom: -1px; left: -1px; border-bottom: 2px solid; border-left: 2px solid; }
    .panel-corner.br { bottom: -1px; right: -1px; border-bottom: 2px solid; border-right: 2px solid; }

    .panel-body {
      display: flex;
      flex-direction: column;
      gap: 14px;
      flex: 1;
      min-height: 0;
    }
    .panel-placeholder {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "Orbitron", sans-serif;
      font-size: 12px;
      letter-spacing: 4px;
      color: rgba(0, 255, 136, 0.45);
      text-align: center;
    }
    .panel-placeholder .dot {
      display: inline-block;
      width: 6px;
      height: 6px;
      background: var(--hud-amber);
      border-radius: 50%;
      margin-right: 8px;
      vertical-align: middle;
      box-shadow: 0 0 6px var(--hud-amber);
      animation: blink 1.4s ease-in-out infinite;
    }

    .circuit-id {
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .circuit-id .flag {
      font-size: 36px;
      line-height: 1;
      filter: saturate(1.15) drop-shadow(0 0 6px rgba(0,0,0,0.5));
    }
    .circuit-id .name {
      font-family: "Orbitron", sans-serif;
      font-weight: 900;
      font-size: 20px;
      letter-spacing: 4px;
      color: var(--hud-green);
      text-shadow: 0 0 8px var(--hud-green-glow);
      line-height: 1.1;
    }
    .circuit-id .full {
      font-family: "Share Tech Mono", monospace;
      font-size: 10px;
      letter-spacing: 1.2px;
      color: rgba(0, 255, 136, 0.55);
      margin-top: 4px;
    }

    .weather-state {
      font-family: "Orbitron", sans-serif;
      font-size: 13px;
      letter-spacing: 3px;
      color: var(--hud-cyan);
      text-shadow: 0 0 8px rgba(0, 221, 255, 0.5);
      padding: 8px 10px;
      border-top: 1px solid var(--hud-green-dim);
      border-bottom: 1px solid var(--hud-green-dim);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .refreshing-tag {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-family: "Orbitron", sans-serif;
      font-size: 10px;
      letter-spacing: 3px;
      color: var(--hud-amber);
      text-shadow: 0 0 6px rgba(255, 170, 0, 0.5);
    }
    .refreshing-tag .dot {
      width: 6px;
      height: 6px;
      background: var(--hud-amber);
      border-radius: 50%;
      box-shadow: 0 0 6px var(--hud-amber);
      animation: blink 1.4s ease-in-out infinite;
    }
    .weather-state .day-tag {
      font-size: 10px;
      letter-spacing: 2px;
      color: rgba(0, 255, 136, 0.6);
      text-shadow: none;
    }

    .temp-block {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 10px;
      padding: 4px 0 6px;
    }
    .temp-big {
      font-family: "Orbitron", sans-serif;
      font-weight: 700;
      font-size: 76px;
      line-height: 0.85;
      color: var(--hud-green);
      text-shadow:
        0 0 12px var(--hud-green-glow),
        0 0 28px rgba(0, 255, 136, 0.35);
      letter-spacing: -2px;
    }
    .temp-big .unit {
      font-size: 24px;
      vertical-align: top;
      margin-left: 4px;
      color: rgba(0, 255, 136, 0.55);
      letter-spacing: 0;
    }
    .temp-meta {
      text-align: right;
      font-family: "Share Tech Mono", monospace;
      font-size: 11px;
      letter-spacing: 1.5px;
      color: rgba(0, 255, 136, 0.6);
      line-height: 1.4;
    }
    .temp-meta .feels-value {
      display: block;
      font-size: 16px;
      color: var(--hud-green);
      text-shadow: 0 0 6px var(--hud-green-glow);
      margin-top: 2px;
    }

    .data-rows {
      display: flex;
      flex-direction: column;
      gap: 0;
      font-family: "Share Tech Mono", monospace;
      font-size: 12px;
      overflow-y: auto;
      min-height: 0;
    }
    .data-rows::-webkit-scrollbar { width: 4px; }
    .data-rows::-webkit-scrollbar-thumb { background: var(--hud-green-dim); }

    .data-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 10px;
      padding: 6px 2px;
      border-bottom: 1px dashed rgba(0, 255, 136, 0.12);
      letter-spacing: 1.5px;
    }
    .data-row:last-child { border-bottom: 0; }
    .data-row .label {
      color: rgba(0, 255, 136, 0.5);
      font-size: 11px;
    }
    .data-row .value {
      color: var(--hud-green);
      font-weight: 700;
      text-align: right;
      letter-spacing: 1.5px;
    }
    .data-row .value.amber {
      color: var(--hud-amber);
      text-shadow: 0 0 6px rgba(255, 170, 0, 0.5);
    }
    .data-row .value.red {
      color: var(--hud-red);
      text-shadow: 0 0 6px rgba(255, 51, 68, 0.55);
    }
    .data-row .value.cyan {
      color: var(--hud-cyan);
      text-shadow: 0 0 6px rgba(0, 221, 255, 0.45);
    }
    .data-row .value.dim {
      color: rgba(0, 255, 136, 0.45);
    }

    /* ===== Right panel: forecast + wind ===== */
    .panel-right {
      top: 110px;
      bottom: 80px;
      right: 60px;
      width: 340px;
      padding: 22px 20px 18px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      overflow: hidden;
    }
    .panel-right .panel-body {
      gap: 8px;
    }

    .section-header {
      font-family: "Orbitron", sans-serif;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 3px;
      color: var(--hud-cyan);
      text-shadow: 0 0 6px rgba(0, 221, 255, 0.45);
      padding: 4px 2px;
      border-bottom: 1px solid var(--hud-green-dim);
      display: flex;
      justify-content: space-between;
      align-items: baseline;
    }
    .section-header .meta {
      font-family: "Share Tech Mono", monospace;
      font-size: 9px;
      letter-spacing: 1.2px;
      color: rgba(0, 255, 136, 0.45);
      text-shadow: none;
    }

    /* Precipitation chart */
    .chart-precip {
      display: flex;
      gap: 3px;
      align-items: stretch;
      padding: 10px 0 6px;
    }
    .bar-col {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      font-family: "Share Tech Mono", monospace;
      font-size: 9px;
      letter-spacing: 0.3px;
    }
    .bar-pct {
      color: rgba(0, 255, 136, 0.7);
      height: 11px;
      line-height: 11px;
    }
    .bar-pct.amber { color: var(--hud-amber); }
    .bar-pct.red   { color: var(--hud-red); }
    .bar-track {
      width: 100%;
      height: 96px;
      position: relative;
      border-bottom: 1px solid var(--hud-green-dim);
      display: flex;
      align-items: flex-end;
      justify-content: center;
      background:
        repeating-linear-gradient(
          to bottom,
          rgba(0, 255, 136, 0.04) 0,
          rgba(0, 255, 136, 0.04) 1px,
          transparent 1px,
          transparent 24px
        );
    }
    .bar {
      width: 76%;
      background: var(--hud-green);
      box-shadow: 0 0 6px var(--hud-green);
      min-height: 2px;
      transition: height 0.4s ease, background-color 0.3s ease;
    }
    .bar.amber {
      background: var(--hud-amber);
      box-shadow: 0 0 6px var(--hud-amber);
    }
    .bar.red {
      background: var(--hud-red);
      box-shadow: 0 0 6px var(--hud-red);
    }
    .bar-time {
      color: rgba(0, 255, 136, 0.5);
    }

    /* Wind compass */
    .compass-wrap {
      position: relative;
      padding: 12px 0 4px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .compass {
      width: 200px;
      height: 200px;
      filter: drop-shadow(0 0 6px var(--hud-green-glow));
    }
    .compass .ring-outer {
      fill: rgba(0, 255, 136, 0.03);
      stroke: var(--hud-green);
      stroke-width: 1.5;
      opacity: 0.85;
    }
    .compass .ring-inner {
      fill: none;
      stroke: var(--hud-green-dim);
      stroke-width: 1;
      stroke-dasharray: 3 3;
    }
    .compass .tick {
      stroke: var(--hud-green-dim);
      stroke-width: 1;
    }
    .compass .tick-major {
      stroke: var(--hud-green);
      stroke-width: 1.5;
    }
    .compass .cardinal {
      fill: var(--hud-green);
      font-family: "Orbitron", sans-serif;
      font-size: 13px;
      font-weight: 700;
      text-anchor: middle;
      dominant-baseline: central;
    }
    .compass .cardinal.n {
      fill: var(--hud-amber);
    }
    .compass .needle {
      transition: transform 0.7s cubic-bezier(0.4, 1.4, 0.6, 1);
      transform-origin: 100px 100px;
    }
    .compass .needle-arrow {
      fill: var(--hud-green);
      filter: drop-shadow(0 0 4px var(--hud-green));
    }
    .compass .needle-tail {
      fill: rgba(0, 255, 136, 0.2);
      stroke: rgba(0, 255, 136, 0.45);
      stroke-width: 0.5;
    }
    .compass .hub {
      fill: var(--hud-cyan);
      filter: drop-shadow(0 0 5px var(--hud-cyan));
    }
    .compass-center {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, calc(-50% + 36px));
      pointer-events: none;
      text-align: center;
      font-family: "Orbitron", sans-serif;
      font-size: 11px;
      letter-spacing: 2px;
      color: var(--hud-cyan);
      text-shadow: 0 0 6px rgba(0, 221, 255, 0.5);
    }

    /* Transient "UPDATED" toast above the bottom strip */
    .update-toast {
      position: fixed;
      bottom: 84px;
      left: 50%;
      transform: translate(-50%, 10px);
      z-index: 60;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 6px 18px;
      background: var(--bg-panel);
      border: 1px solid var(--hud-cyan);
      backdrop-filter: blur(6px);
      box-shadow:
        0 0 14px rgba(0, 221, 255, 0.45),
        inset 0 0 18px rgba(0, 221, 255, 0.08);
      font-family: "Orbitron", sans-serif;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 4px;
      color: var(--hud-cyan);
      text-shadow: 0 0 6px rgba(0, 221, 255, 0.6);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.35s ease, transform 0.35s ease;
    }
    .update-toast.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }
    .update-toast::before {
      content: "";
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--hud-cyan);
      box-shadow: 0 0 8px var(--hud-cyan);
      animation: blink 0.8s ease-in-out infinite;
    }
  </style>
</head>
<body>
  <div id="app">
    <div id="map"></div>
  </div>

  <aside class="panel panel-left" id="panel-left">
    <span class="panel-label">CURRENT CONDITIONS</span>
    <span class="panel-corner tl"></span>
    <span class="panel-corner tr"></span>
    <span class="panel-corner bl"></span>
    <span class="panel-corner br"></span>
    <div class="panel-body" id="panel-current">
      <div class="panel-placeholder">
        <div><span class="dot"></span>STANDBY</div>
      </div>
    </div>
  </aside>

  <aside class="panel panel-right" id="panel-right">
    <span class="panel-label">FORECAST + WIND</span>
    <span class="panel-corner tl"></span>
    <span class="panel-corner tr"></span>
    <span class="panel-corner bl"></span>
    <span class="panel-corner br"></span>
    <div class="panel-body" id="panel-forecast">
      <div class="panel-placeholder">
        <div><span class="dot"></span>STANDBY</div>
      </div>
    </div>
  </aside>

  <div class="top-strip">
    <div class="brand">RACE<span class="accent">WEATHER</span></div>
    <nav class="tabs" id="tabs"></nav>
    <div class="right">
      <span class="live-badge">LIVE</span>
      <span id="clock">--:--:--</span>
    </div>
  </div>

  <div class="bottom-strip" id="bottom-strip">
    <div class="bottom-section">
      <span class="track-state standby">
        <span class="track-state-dot"></span>
        <span class="track-state-text">TRACK STATUS — STANDBY</span>
      </span>
    </div>
    <div class="bottom-section center"></div>
    <div class="bottom-section"></div>
  </div>

  <div id="update-toast" class="update-toast">UPDATED</div>

  <div class="grid-overlay"></div>
  <div class="vignette"></div>
  <div class="scanlines"></div>
  <div class="corner-brackets"><span></span></div>

  <script>
    // ===== Circuit data =====
    const CIRCUITS = [
      { id: "imola",      name: "IMOLA",      tab: "IMOLA",      full: "Autodromo Enzo e Dino Ferrari", country: "Italy",   flag: "🇮🇹", lat:  44.3439, lng:  11.7167, elev:  47 },
      { id: "spa",        name: "SPA",        tab: "SPA",        full: "Circuit de Spa-Francorchamps",   country: "Belgium", flag: "🇧🇪", lat:  50.4372, lng:   5.9714, elev: 401 },
      { id: "lemans",     name: "LE MANS",    tab: "LE MANS",    full: "Circuit de la Sarthe",           country: "France",  flag: "🇫🇷", lat:  47.9562, lng:   0.2075, elev:  62 },
      { id: "interlagos", name: "INTERLAGOS", tab: "INTERLAGOS", full: "Autódromo José Carlos Pace",     country: "Brazil",  flag: "🇧🇷", lat: -23.7036, lng: -46.6997, elev: 750 },
      { id: "cota",       name: "COTA",       tab: "COTA",       full: "Circuit of the Americas",        country: "USA",     flag: "🇺🇸", lat:  30.1328, lng: -97.6411, elev: 163 },
      { id: "fuji",       name: "FUJI",       tab: "FUJI",       full: "Fuji Speedway",                  country: "Japan",   flag: "🇯🇵", lat:  35.3725, lng: 138.9267, elev: 560 },
      { id: "lusail",     name: "LUSAIL",     tab: "QATAR",      full: "Lusail International Circuit",   country: "Qatar",   flag: "🇶🇦", lat:  25.4900, lng:  51.4543, elev:   8 },
      { id: "bahrain",    name: "BAHRAIN",    tab: "BAHRAIN",    full: "Bahrain International Circuit",  country: "Bahrain", flag: "🇧🇭", lat:  26.0325, lng:  50.5106, elev:   7 },
    ];

    const CIRCUIT_ZOOM = 14;

    // ===== Map init =====
    // TV display: no controls, no manual panning/zooming.
    // Navigation happens via tabs + marker clicks, which call flyTo.
    const map = L.map("map", {
      zoomControl: false,
      attributionControl: false,
      worldCopyJump: true,
      preferCanvas: true,
      dragging: false,
      scrollWheelZoom: false,
      doubleClickZoom: false,
      boxZoom: false,
      keyboard: false,
      touchZoom: false,
    });

    L.tileLayer(
      "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
      { maxZoom: 18 }
    ).addTo(map);

    // Initial view: fit all 8 circuits so every marker is visible.
    const ALL_CIRCUITS_BOUNDS = L.latLngBounds(
      CIRCUITS.map((c) => [c.lat, c.lng])
    ).pad(0.25);
    map.fitBounds(ALL_CIRCUITS_BOUNDS, { animate: false });

    // Pulse marker icon
    const pulseIcon = L.divIcon({
      className: "",
      html: `
        <div class="circuit-marker">
          <div class="ring"></div>
          <div class="ring delay"></div>
          <div class="core"></div>
        </div>
      `,
      iconSize: [18, 18],
      iconAnchor: [9, 9],
    });

    // ===== Tabs + markers (shared activation) =====
    const tabsEl = document.getElementById("tabs");
    const tabNodes = new Map();
    const markerNodes = new Map();
    let activeCircuitId = null;

    function setActiveCircuit(id, { fly = true } = {}) {
      activeCircuitId = id;

      tabNodes.forEach((node, key) => {
        node.classList.toggle("active", key === id);
      });

      const c = CIRCUITS.find((x) => x.id === id);
      if (fly && c) {
        map.flyTo([c.lat, c.lng], CIRCUIT_ZOOM, { duration: 1.8 });
      }

      renderPanels();
      ensureCircuitWeather(c);
    }

    CIRCUITS.forEach((c) => {
      // Tab
      const tab = document.createElement("button");
      tab.type = "button";
      tab.className = "tab";
      tab.dataset.circuit = c.id;
      tab.innerHTML = `<span class="flag">${c.flag}</span><span>${c.tab}</span>`;
      tab.addEventListener("click", () => setActiveCircuit(c.id));
      tabsEl.appendChild(tab);
      tabNodes.set(c.id, tab);

      // Marker
      const marker = L.marker([c.lat, c.lng], { icon: pulseIcon }).addTo(map);
      marker.bindTooltip(`${c.flag}  ${c.name}`, {
        className: "circuit-tooltip",
        direction: "top",
        offset: [0, -10],
        permanent: false,
      });
      marker.on("click", () => setActiveCircuit(c.id));
      markerNodes.set(c.id, marker);
    });

    // ===== Clock =====
    function updateClock() {
      const now = new Date();
      const hh = String(now.getUTCHours()).padStart(2, "0");
      const mm = String(now.getUTCMinutes()).padStart(2, "0");
      const ss = String(now.getUTCSeconds()).padStart(2, "0");
      document.getElementById("clock").textContent = `${hh}:${mm}:${ss} UTC`;
    }
    updateClock();
    setInterval(updateClock, 1000);

    // ===== Open-Meteo weather fetch (lazy + cached) =====
    const WEATHER_API = "https://api.open-meteo.com/v1/forecast";
    const CACHE_TTL_MS = 10 * 60 * 1000; // 10 minutes

    const CURRENT_VARS = [
      "temperature_2m",
      "relative_humidity_2m",
      "apparent_temperature",
      "precipitation",
      "rain",
      "weather_code",
      "cloud_cover",
      "surface_pressure",
      "wind_speed_10m",
      "wind_direction_10m",
      "wind_gusts_10m",
      "is_day",
      "dew_point_2m",
    ];
    const HOURLY_VARS = [
      "temperature_2m",
      "precipitation_probability",
      "weather_code",
      "wind_speed_10m",
      "soil_temperature_0cm",
      "visibility",
    ];
    const DAILY_VARS = [
      "sunrise",
      "sunset",
      "uv_index_max",
      "temperature_2m_max",
      "temperature_2m_min",
    ];

    function buildWeatherURL(c) {
      const params = new URLSearchParams({
        latitude: c.lat,
        longitude: c.lng,
        current: CURRENT_VARS.join(","),
        hourly: HOURLY_VARS.join(","),
        daily: DAILY_VARS.join(","),
        forecast_days: "2",
        timezone: "auto",
      });
      return `${WEATHER_API}?${params}`;
    }

    async function fetchCircuitWeather(c) {
      const res = await fetch(buildWeatherURL(c));
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      return res.json();
    }

    function isCacheFresh(c) {
      return (
        c.weather &&
        c.weatherFetchedAt &&
        Date.now() - c.weatherFetchedAt < CACHE_TTL_MS
      );
    }

    async function ensureCircuitWeather(c) {
      if (!c) return;
      if (isCacheFresh(c)) return;
      if (c.weatherLoading) return; // already in-flight

      c.weatherLoading = true;
      if (activeCircuitId === c.id) renderPanels();

      const t0 = performance.now();
      let updated = false;
      try {
        const data = await fetchCircuitWeather(c);
        c.weather = data;
        c.weatherFetchedAt = Date.now();
        updated = true;
        const dt = (performance.now() - t0).toFixed(0);
        console.log(`[RaceWeather] ${c.id} fetched in ${dt}ms`, {
          tempC: data.current?.temperature_2m,
          rainMM: data.current?.precipitation,
          windKmh: data.current?.wind_speed_10m,
          windDir: data.current?.wind_direction_10m,
          weatherCode: data.current?.weather_code,
        });
      } catch (err) {
        console.warn(
          `[RaceWeather] ${c.id} fetch failed — keeping last data`,
          err
        );
      } finally {
        c.weatherLoading = false;
        if (activeCircuitId === c.id) renderPanels();
        if (updated && activeCircuitId === c.id) showUpdateToast();
      }
    }

    let updateToastTimer = null;
    function showUpdateToast() {
      const el = document.getElementById("update-toast");
      if (!el) return;
      el.classList.add("show");
      clearTimeout(updateToastTimer);
      updateToastTimer = setTimeout(() => el.classList.remove("show"), 2000);
    }

    // Expose for console inspection: `CIRCUITS[0].weather`
    window.CIRCUITS = CIRCUITS;

    // ===== WMO weather code → text =====
    const WMO_CODES = {
      0:  "CLEAR SKY",
      1:  "MAINLY CLEAR",
      2:  "PARTLY CLOUDY",
      3:  "OVERCAST",
      45: "FOG",
      48: "RIME FOG",
      51: "LIGHT DRIZZLE",
      53: "DRIZZLE",
      55: "DENSE DRIZZLE",
      56: "FREEZING DRIZZLE",
      57: "FREEZING DRIZZLE",
      61: "LIGHT RAIN",
      63: "RAIN",
      65: "HEAVY RAIN",
      66: "FREEZING RAIN",
      67: "FREEZING RAIN",
      71: "LIGHT SNOW",
      73: "SNOW",
      75: "HEAVY SNOW",
      77: "SNOW GRAINS",
      80: "LIGHT SHOWERS",
      81: "SHOWERS",
      82: "VIOLENT SHOWERS",
      85: "SNOW SHOWERS",
      86: "HEAVY SNOW SHOWERS",
      95: "THUNDERSTORM",
      96: "THUNDERSTORM + HAIL",
      99: "SEVERE THUNDERSTORM",
    };
    const weatherCodeText = (code) => WMO_CODES[code] ?? `CODE ${code}`;

    // ===== Render helpers =====
    function uvLabel(uv) {
      if (uv == null) return { text: "—", cls: "dim" };
      if (uv >= 11) return { text: `EXTREME ${uv.toFixed(0)}`, cls: "red" };
      if (uv >= 8)  return { text: `VERY HIGH ${uv.toFixed(0)}`, cls: "red" };
      if (uv >= 6)  return { text: `HIGH ${uv.toFixed(0)}`, cls: "amber" };
      if (uv >= 3)  return { text: `MODERATE ${uv.toFixed(0)}`, cls: "" };
      return { text: `LOW ${uv.toFixed(0)}`, cls: "cyan" };
    }

    function classifyValue(v, { red, amber, low } = {}) {
      if (v == null || Number.isNaN(v)) return "dim";
      if (red != null && v >= red) return "red";
      if (amber != null && v >= amber) return "amber";
      if (low != null && v <= low) return "amber";
      return "";
    }

    function formatHM(iso) {
      // "2026-05-12T05:42" → "05:42"
      if (!iso) return "—";
      const m = iso.match(/T(\d{2}:\d{2})/);
      return m ? m[1] : iso;
    }

    function currentHourIndex(weather) {
      const t = weather?.current?.time;
      const arr = weather?.hourly?.time;
      if (!t || !arr) return -1;
      // current.time is at minute resolution ("...T15:42"), hourly is hourly
      // ("...T15:00") — align to the hour, then fall back to the latest
      // hourly entry not after current.
      const hourKey = t.slice(0, 13) + ":00";
      const hit = arr.indexOf(hourKey);
      if (hit >= 0) return hit;
      for (let i = arr.length - 1; i >= 0; i--) {
        if (arr[i] <= t) return i;
      }
      return 0;
    }

    function row(label, value, cls = "") {
      return `<div class="data-row"><span class="label">${label}</span><span class="value ${cls}">${value}</span></div>`;
    }

    // ===== Wind helpers =====
    const DIR_NAMES = [
      "N","NNE","NE","ENE","E","ESE","SE","SSE",
      "S","SSW","SW","WSW","W","WNW","NW","NNW",
    ];
    function dirName(deg) {
      if (deg == null || Number.isNaN(deg)) return "—";
      const n = ((deg % 360) + 360) % 360;
      return DIR_NAMES[Math.round(n / 22.5) % 16];
    }

    function beaufort(kmh) {
      if (kmh == null || Number.isNaN(kmh)) return { n: null, name: "—" };
      const v = kmh;
      if (v < 1)   return { n: 0,  name: "CALM" };
      if (v < 6)   return { n: 1,  name: "LIGHT AIR" };
      if (v < 12)  return { n: 2,  name: "LIGHT BREEZE" };
      if (v < 20)  return { n: 3,  name: "GENTLE BREEZE" };
      if (v < 29)  return { n: 4,  name: "MODERATE BREEZE" };
      if (v < 39)  return { n: 5,  name: "FRESH BREEZE" };
      if (v < 50)  return { n: 6,  name: "STRONG BREEZE" };
      if (v < 62)  return { n: 7,  name: "NEAR GALE" };
      if (v < 75)  return { n: 8,  name: "GALE" };
      if (v < 89)  return { n: 9,  name: "STRONG GALE" };
      if (v < 103) return { n: 10, name: "STORM" };
      if (v < 118) return { n: 11, name: "VIOLENT STORM" };
      return { n: 12, name: "HURRICANE" };
    }

    function build12hPrecip(weather) {
      const arr = weather?.hourly?.time;
      const probs = weather?.hourly?.precipitation_probability;
      const start = currentHourIndex(weather);
      if (!arr || !probs || start < 0) return [];
      const out = [];
      for (let i = 0; i < 12 && start + i < arr.length; i++) {
        const t = arr[start + i];
        out.push({ hour: t.slice(11, 13), pct: probs[start + i] ?? 0 });
      }
      return out;
    }

    function buildCompassSVG(dirDeg) {
      const cx = 100, cy = 100, R = 92;
      const ticks = [];
      for (let a = 0; a < 360; a += 15) {
        const major = a % 90 === 0;
        const len = major ? 10 : 5;
        const rad = ((a - 90) * Math.PI) / 180;
        const x1 = cx + R * Math.cos(rad);
        const y1 = cy + R * Math.sin(rad);
        const x2 = cx + (R - len) * Math.cos(rad);
        const y2 = cy + (R - len) * Math.sin(rad);
        ticks.push(
          `<line class="tick${major ? " tick-major" : ""}" x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}"/>`
        );
      }
      const rot = dirDeg ?? 0;
      return `
        <svg class="compass" viewBox="0 0 200 200" aria-hidden="true">
          <circle class="ring-outer" cx="100" cy="100" r="92"/>
          <circle class="ring-inner" cx="100" cy="100" r="74"/>
          ${ticks.join("")}
          <text class="cardinal n" x="100" y="14">N</text>
          <text class="cardinal"   x="186" y="100">E</text>
          <text class="cardinal"   x="100" y="186">S</text>
          <text class="cardinal"   x="14"  y="100">W</text>
          <g class="needle" style="transform: rotate(${rot}deg)">
            <polygon class="needle-arrow" points="100,26 92,100 108,100"/>
            <polygon class="needle-tail"  points="92,100 108,100 100,158"/>
          </g>
          <circle class="hub" cx="100" cy="100" r="5"/>
        </svg>
      `;
    }

    function renderCurrentPanel() {
      const el = document.getElementById("panel-current");
      const c = CIRCUITS.find((x) => x.id === activeCircuitId);

      if (!c) {
        el.innerHTML = `<div class="panel-placeholder"><div><span class="dot"></span>SELECT CIRCUIT</div></div>`;
        return;
      }
      if (!c.weather) {
        el.innerHTML = `
          <div class="circuit-id">
            <span class="flag">${c.flag}</span>
            <div>
              <div class="name">${c.name}</div>
              <div class="full">${c.full}</div>
            </div>
          </div>
          <div class="panel-placeholder"><div><span class="dot"></span>ACQUIRING DATA…</div></div>`;
        return;
      }

      const w = c.weather;
      const cur = w.current ?? {};
      const hr = w.hourly ?? {};
      const dy = w.daily ?? {};
      const hIdx = currentHourIndex(w);

      const precipProb = hIdx >= 0 ? hr.precipitation_probability?.[hIdx] : null;
      const soilTemp   = hIdx >= 0 ? hr.soil_temperature_0cm?.[hIdx]      : null;

      const uv = uvLabel(dy.uv_index_max?.[0]);

      const soilCls   = classifyValue(soilTemp,   { red: 50, amber: 40, low: 15 });
      const precipCls = classifyValue(precipProb, { red: 70, amber: 40 });

      const temp     = cur.temperature_2m;
      const feels    = cur.apparent_temperature;
      const humidity = cur.relative_humidity_2m;
      const pressure = cur.surface_pressure;
      const clouds   = cur.cloud_cover;
      const dew      = cur.dew_point_2m;
      const isDay    = cur.is_day === 1;
      const wcText   = weatherCodeText(cur.weather_code);

      const fmt = (v, digits = 0, suffix = "") =>
        v == null || Number.isNaN(v) ? "—" : `${v.toFixed(digits)}${suffix}`;

      el.innerHTML = `
        <div class="circuit-id">
          <span class="flag">${c.flag}</span>
          <div>
            <div class="name">${c.name}</div>
            <div class="full">${c.full}</div>
          </div>
        </div>

        <div class="weather-state">
          <span>${wcText}</span>
          <span class="day-tag">
            ${c.weatherLoading ? '<span class="refreshing-tag"><span class="dot"></span>REFRESHING</span> ' : ""}${isDay ? "DAY" : "NIGHT"}
          </span>
        </div>

        <div class="temp-block">
          <div class="temp-big">${fmt(temp, 0)}<span class="unit">°C</span></div>
          <div class="temp-meta">
            FEELS LIKE
            <span class="feels-value">${fmt(feels, 1, " °C")}</span>
          </div>
        </div>

        <div class="data-rows">
          ${row("SURFACE TEMP",   fmt(soilTemp, 1, " °C"),       soilCls)}
          ${row("HUMIDITY",       fmt(humidity, 0, " %"))}
          ${row("PRESSURE",       fmt(pressure, 0, " hPa"))}
          ${row("PRECIP PROB",    fmt(precipProb, 0, " %"),      precipCls)}
          ${row("CLOUD COVER",    fmt(clouds, 0, " %"))}
          ${row("UV INDEX",       uv.text,                       uv.cls)}
          ${row("DEW POINT",      fmt(dew, 1, " °C"))}
          ${row("SUNRISE",        formatHM(dy.sunrise?.[0]),     "cyan")}
          ${row("SUNSET",         formatHM(dy.sunset?.[0]),      "cyan")}
        </div>
      `;
    }

    function renderForecastPanel() {
      const el = document.getElementById("panel-forecast");
      const c = CIRCUITS.find((x) => x.id === activeCircuitId);

      if (!c) {
        el.innerHTML = `<div class="panel-placeholder"><div><span class="dot"></span>SELECT CIRCUIT</div></div>`;
        return;
      }
      if (!c.weather) {
        el.innerHTML = `<div class="panel-placeholder"><div><span class="dot"></span>ACQUIRING DATA…</div></div>`;
        return;
      }

      const w = c.weather;
      const cur = w.current ?? {};

      // ---- 12h precipitation chart
      const series = build12hPrecip(w);
      const chartHTML = series.length
        ? series
            .map(({ hour, pct }) => {
              const v = Number.isFinite(pct) ? pct : 0;
              const cls = v >= 60 ? "red" : v >= 30 ? "amber" : "";
              const h = Math.max(2, Math.min(100, v));
              return `
                <div class="bar-col">
                  <div class="bar-pct ${cls}">${v}</div>
                  <div class="bar-track"><div class="bar ${cls}" style="height: ${h}%"></div></div>
                  <div class="bar-time">${hour}</div>
                </div>`;
            })
            .join("")
        : `<div class="bar-col"><div class="bar-pct">—</div><div class="bar-track"></div><div class="bar-time">—</div></div>`;

      // ---- Wind block
      const ws    = cur.wind_speed_10m;
      const gust  = cur.wind_gusts_10m;
      const dDeg  = cur.wind_direction_10m;
      const dTxt  = dirName(dDeg);
      const bft   = beaufort(ws);

      const speedCls = classifyValue(ws,   { red: 50, amber: 30 });
      const gustCls  = classifyValue(gust, { red: 60, amber: 40 });

      const fmt = (v, digits = 0, suffix = "") =>
        v == null || Number.isNaN(v) ? "—" : `${v.toFixed(digits)}${suffix}`;

      const headerMeta =
        dDeg == null ? "—" : `${dTxt} ${Math.round(dDeg)}°`;

      el.innerHTML = `
        <div class="section-header">
          <span>12H PRECIPITATION</span>
          <span class="meta">PROB %</span>
        </div>
        <div class="chart-precip">${chartHTML}</div>

        <div class="section-header">
          <span>WIND VECTOR</span>
          <span class="meta">${headerMeta}</span>
        </div>
        <div class="compass-wrap">
          ${buildCompassSVG(dDeg)}
          <div class="compass-center">DIR ${dDeg == null ? "—" : Math.round(dDeg) + "°"}</div>
        </div>

        <div class="data-rows">
          ${row("WIND SPEED", fmt(ws,   1, " km/h"), speedCls)}
          ${row("GUSTS",      fmt(gust, 1, " km/h"), gustCls)}
          ${row("DIRECTION",  headerMeta)}
          ${row("BEAUFORT",   bft.n == null ? "—" : `${bft.n} ${bft.name}`)}
        </div>
      `;
    }

    // ===== Track status helpers =====
    function trackState(precipProb, precipMM) {
      const prob = precipProb ?? 0;
      const mm = precipMM ?? 0;
      if (prob > 60 || mm >= 0.5) return "WET";
      if (prob >= 20 || mm > 0) return "DAMP";
      return "DRY";
    }

    function gripLevel(state, surfaceTemp, windKmh) {
      if (state === "WET" && (windKmh ?? 0) > 40) return "VERY LOW";
      if (state === "WET") return "LOW";
      if (state === "DAMP") return "MEDIUM";
      // DRY
      if (surfaceTemp == null) return "MEDIUM";
      if (surfaceTemp < 20 || surfaceTemp > 50) return "MEDIUM";
      return "HIGH";
    }

    function nextRainText(weather) {
      const cur = weather?.current ?? {};
      const probs = weather?.hourly?.precipitation_probability;
      if ((cur.precipitation ?? 0) > 0) return "NOW";
      const idx = currentHourIndex(weather);
      if (idx < 0 || !probs) return "—";
      for (let i = 1; i < 24 && idx + i < probs.length; i++) {
        if ((probs[idx + i] ?? 0) > 50) return `+${i}H`;
      }
      return "—";
    }

    function metric(label, value, cls = "") {
      return `<span class="metric"><span class="metric-label">${label}</span><span class="metric-value ${cls}">${value}</span></span>`;
    }

    function renderBottomStrip() {
      const stripEl = document.getElementById("bottom-strip");
      const c = CIRCUITS.find((x) => x.id === activeCircuitId);

      const coordsHTML = c
        ? `<span class="coords">
            <span class="label">LAT</span>${c.lat.toFixed(4)}°
            <span class="sep">/</span>
            <span class="label">LNG</span>${c.lng.toFixed(4)}°
            <span class="sep">/</span>
            <span class="label">ALT</span>${c.elev} M
          </span>`
        : "";

      if (!c || !c.weather) {
        stripEl.innerHTML = `
          <div class="bottom-section">
            <span class="track-state standby">
              <span class="track-state-dot"></span>
              <span class="track-state-text">TRACK STATUS — ${c ? "ACQUIRING DATA" : "STANDBY"}</span>
            </span>
          </div>
          <div class="bottom-section center"></div>
          <div class="bottom-section">${coordsHTML}</div>`;
        return;
      }

      const cur = c.weather.current ?? {};
      const hr = c.weather.hourly ?? {};
      const idx = currentHourIndex(c.weather);

      const precipProb = idx >= 0 ? hr.precipitation_probability?.[idx] : null;
      const soilTemp   = idx >= 0 ? hr.soil_temperature_0cm?.[idx]      : null;
      const visMeters  = idx >= 0 ? hr.visibility?.[idx]                : null;
      const visKm      = visMeters != null ? visMeters / 1000 : null;
      const wind       = cur.wind_speed_10m;
      const precipMM   = cur.precipitation;

      const state = trackState(precipProb, precipMM);
      const grip  = gripLevel(state, soilTemp, wind);
      const stateCls = state.toLowerCase();

      const surfCls = classifyValue(soilTemp,   { red: 50, amber: 40, low: 15 });
      const windCls = classifyValue(wind,       { red: 60, amber: 40 });
      const rainCls = classifyValue(precipProb, { red: 60, amber: 20 });
      const visCls  =
        visKm == null ? "dim" :
        visKm < 5     ? "red" :
        visKm < 10    ? "amber" : "";

      const nextRain = nextRainText(c.weather);
      const nextCls =
        nextRain === "NOW"                 ? "red" :
        /^\+([123])H$/.test(nextRain)      ? "amber" :
        /^\+\d+H$/.test(nextRain)          ? "" : "dim";

      const fmt = (v, digits, suffix) =>
        v == null || Number.isNaN(v) ? "—" : `${v.toFixed(digits)}${suffix}`;

      stripEl.innerHTML = `
        <div class="bottom-section">
          <span class="track-state ${stateCls}">
            <span class="track-state-dot"></span>
            <span class="track-state-text">TRACK ${state} — ${grip} GRIP</span>
          </span>
        </div>
        <div class="bottom-section center">
          ${metric("SURF",      fmt(soilTemp, 0, "°C"),    surfCls)}
          <span class="sep">|</span>
          ${metric("WIND",      fmt(wind, 0, " km/h"),     windCls)}
          <span class="sep">|</span>
          ${metric("RAIN",      fmt(precipProb, 0, "%"),   rainCls)}
          <span class="sep">|</span>
          ${metric("NEXT RAIN", nextRain,                  nextCls)}
          <span class="sep">|</span>
          ${metric("VIS",       fmt(visKm, 0, " km"),      visCls)}
        </div>
        <div class="bottom-section">${coordsHTML}</div>
      `;
    }

    function renderPanels() {
      renderCurrentPanel();
      renderForecastPanel();
      renderBottomStrip();
    }

    // Boot sequence:
    //  1. Map opens at world view showing all 8 circuits (handled above).
    //  2. After a short beat, auto-select Imola — activates the tab,
    //     flies the map there, and triggers its first fetch. Subsequent
    //     circuits fetch lazily on tab/marker click, cached for 10min.
    renderPanels(); // initial STANDBY paint
    setTimeout(() => setActiveCircuit("imola"), 1800);
  </script>
</body>
</html>

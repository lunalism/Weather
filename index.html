<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RaceWeather</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Orbitron:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  />
  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
  ></script>

  <style>
    :root {
      /* Backgrounds */
      --bg-deep: #f5f5f7;
      --bg-surface: #ffffff;
      --bg-card: rgba(255, 255, 255, 0.86);
      --bg-card-strong: rgba(255, 255, 255, 0.95);
      --bg-elev: rgba(0, 0, 0, 0.035);
      --bg-elev-hover: rgba(0, 0, 0, 0.06);

      /* Borders */
      --border-subtle: rgba(0, 0, 0, 0.07);
      --border-strong: rgba(0, 0, 0, 0.13);

      /* Text */
      --text-primary: #1a1a2e;
      --text-secondary: #555a66;
      --text-muted: #84899a;
      --text-faint: #b8bcc7;

      /* Accents */
      --accent-blue: #3b82f6;
      --accent-blue-soft: rgba(59, 130, 246, 0.10);
      --accent-blue-border: rgba(59, 130, 246, 0.4);

      /* Status colors (slightly darker for contrast on light) */
      --color-red: #dc2626;
      --color-amber: #d97706;
      --color-green: #059669;

      /* Dark overlay (map-floating pills/buttons/labels) */
      --overlay-dark: rgba(20, 22, 30, 0.82);
      --overlay-dark-strong: rgba(28, 30, 40, 0.92);
      --overlay-dark-border: rgba(255, 255, 255, 0.16);

      /* Shadows (lighter, more diffuse on light bg) */
      --shadow-md: 0 10px 32px rgba(15, 20, 35, 0.08);
      --shadow-sm: 0 2px 10px rgba(15, 20, 35, 0.06);
      --shadow-overlay: 0 4px 14px rgba(0, 0, 0, 0.28);

      /* Radii */
      --radius-card: 18px;
      --radius-pill: 10px;
      --radius-btn: 12px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg-deep);
      color: var(--text-primary);
      font-family: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
      font-feature-settings: "tnum" 1, "cv11" 1;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    button {
      font-family: inherit;
      color: inherit;
      cursor: pointer;
    }

    /* ===== Map ===== */
    #map {
      position: absolute;
      inset: 0;
      background: var(--bg-deep);
      z-index: 1;
    }
    .leaflet-container {
      background: var(--bg-deep);
      font-family: "Inter", sans-serif;
    }
    .leaflet-control-attribution { display: none !important; }
    /* No tile filter — show satellite imagery at native brightness/saturation */

    /* Circuit markers — blue dot with white halo (visible on light + satellite) */
    .circuit-marker {
      position: relative;
      width: 16px;
      height: 16px;
    }
    .circuit-marker .core {
      position: absolute;
      inset: 0;
      margin: auto;
      width: 12px;
      height: 12px;
      background: var(--accent-blue);
      border: 2px solid white;
      border-radius: 50%;
      box-shadow:
        0 0 0 4px rgba(59, 130, 246, 0.25),
        0 2px 6px rgba(0, 0, 0, 0.28);
      transition: all 0.3s ease;
    }
    .circuit-marker .ring {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 1.5px solid rgba(59, 130, 246, 0.7);
      opacity: 0;
      animation: pulse-ring 2.8s ease-out infinite;
      pointer-events: none;
    }
    @keyframes pulse-ring {
      0%   { transform: scale(0.6); opacity: 0.85; }
      80%, 100% { transform: scale(3); opacity: 0; }
    }

    /* Map label: dark pill with wind arrow + temperature, sits above each marker.
       Wrapped in a flex anchor so the natural-width pill stays centered horizontally
       regardless of temperature digit width (e.g. "8°" vs "100°"). */
    .map-label-anchor {
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }
    .map-label {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 3px 9px;
      background: var(--overlay-dark);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid var(--overlay-dark-border);
      border-radius: 13px;
      color: white;
      font-family: "Orbitron", sans-serif;
      font-size: 11px;
      font-weight: 500;
      font-variant-numeric: tabular-nums;
      box-shadow: var(--shadow-overlay);
      white-space: nowrap;
    }
    .map-label .arrow {
      width: 11px;
      height: 11px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.6s ease;
    }
    .map-label .arrow svg {
      width: 100%;
      height: 100%;
      fill: white;
    }
    .map-label .temp {
      letter-spacing: -0.2px;
    }

    /* Tooltip (dark pill — sits on satellite tiles) */
    .leaflet-tooltip.circuit-tooltip {
      background: var(--overlay-dark);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      color: white;
      border: 1px solid var(--overlay-dark-border);
      border-radius: 10px;
      padding: 6px 12px;
      font-family: "Inter", sans-serif;
      font-weight: 500;
      font-size: 12px;
      letter-spacing: 0.2px;
      box-shadow: var(--shadow-overlay);
    }
    .leaflet-tooltip.circuit-tooltip::before { display: none; }

    /* ===== Top bar ===== */
    .top-bar {
      position: fixed;
      top: 20px;
      left: 20px;
      right: 20px;
      z-index: 50;
      padding: 12px 20px;
      background: var(--bg-card);
      backdrop-filter: blur(28px);
      -webkit-backdrop-filter: blur(28px);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-card);
      box-shadow: var(--shadow-md);
      display: flex;
      align-items: center;
      gap: 20px;
    }
    .brand {
      font-family: "Orbitron", sans-serif;
      font-weight: 600;
      font-size: 16px;
      letter-spacing: 0.4px;
      color: var(--text-primary);
      white-space: nowrap;
      flex-shrink: 0;
    }
    .brand .accent {
      color: var(--accent-blue);
      font-weight: 500;
    }

    .tabs {
      display: flex;
      flex: 1;
      justify-content: center;
      gap: 4px;
      overflow: hidden;
    }
    .tab {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 9px 16px;
      background: transparent;
      border: 0;
      border-radius: var(--radius-pill);
      font-family: "Inter", sans-serif;
      font-weight: 500;
      font-size: 13px;
      letter-spacing: 0.2px;
      color: var(--text-muted);
      white-space: nowrap;
      transition: background 0.2s ease, color 0.2s ease, box-shadow 0.25s ease;
    }
    .tab .flag {
      font-size: 16px;
      line-height: 1;
    }
    .tab:hover:not(.active) {
      color: var(--text-primary);
      background: rgba(0, 0, 0, 0.05);
    }
    .tab.active {
      background: var(--accent-blue);
      color: white;
      font-weight: 600;
      box-shadow: 0 4px 14px rgba(59, 130, 246, 0.4);
    }

    .right-controls {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }
    .live-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      background: rgba(239, 68, 68, 0.12);
      border: 1px solid rgba(239, 68, 68, 0.3);
      border-radius: 8px;
      color: var(--color-red);
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
    }
    .live-pill::before {
      content: "";
      width: 5px;
      height: 5px;
      background: var(--color-red);
      border-radius: 50%;
      animation: pulse-soft 1.6s ease-in-out infinite;
    }
    @keyframes pulse-soft {
      0%, 100% { opacity: 1; }
      50%      { opacity: 0.35; }
    }
    .clock-text {
      font-family: "Orbitron", sans-serif;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-secondary);
      font-variant-numeric: tabular-nums;
    }

    /* ===== Panels ===== */
    .panel {
      position: fixed;
      z-index: 40;
      background: var(--bg-card);
      backdrop-filter: blur(28px);
      -webkit-backdrop-filter: blur(28px);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-card);
      box-shadow: var(--shadow-md);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .panel-left {
      top: 92px;
      bottom: 92px;
      left: 20px;
      width: 380px;
      padding: 20px;
    }
    .panel-right {
      top: 92px;
      bottom: 92px;
      right: 20px;
      width: 360px;
      padding: 20px;
    }
    .panel-body {
      display: flex;
      flex-direction: column;
      gap: 14px;
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: var(--border-strong) transparent;
    }
    .panel-body::-webkit-scrollbar { width: 4px; }
    .panel-body::-webkit-scrollbar-thumb {
      background: var(--border-strong);
      border-radius: 4px;
    }
    .panel-body::-webkit-scrollbar-track { background: transparent; }

    .panel-placeholder {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      font-size: 13px;
      color: var(--text-muted);
    }
    .panel-placeholder .dot {
      width: 6px;
      height: 6px;
      background: var(--accent-blue);
      border-radius: 50%;
      animation: pulse-soft 1.4s ease-in-out infinite;
    }

    /* Circuit identity */
    .circuit-id {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 4px 0 4px;
    }
    .circuit-id .flag {
      font-size: 38px;
      line-height: 1;
    }
    .circuit-id .name {
      font-family: "Orbitron", sans-serif;
      font-weight: 600;
      font-size: 22px;
      letter-spacing: 0.3px;
      color: var(--text-primary);
      line-height: 1.1;
    }
    .circuit-id .full {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 4px;
    }

    /* Conditions card */
    .conditions-card {
      background: var(--bg-elev);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-card);
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .conditions-tags {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .cond-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      background: rgba(0, 0, 0, 0.05);
      border: 1px solid var(--border-subtle);
      border-radius: 7px;
      font-size: 11px;
      font-weight: 500;
      color: var(--text-secondary);
    }
    .cond-pill.accent {
      background: var(--accent-blue-soft);
      border-color: var(--accent-blue-border);
      color: var(--accent-blue);
    }
    .cond-pill.amber {
      background: rgba(245, 158, 11, 0.12);
      border-color: rgba(245, 158, 11, 0.32);
      color: var(--color-amber);
    }
    .cond-pill .dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: currentColor;
    }
    .cond-pill.amber .dot {
      animation: pulse-soft 1s ease-in-out infinite;
    }

    .temp-main {
      display: flex;
      align-items: flex-end;
      gap: 14px;
    }
    .temp-large {
      font-family: "Orbitron", sans-serif;
      font-weight: 500;
      font-size: 88px;
      line-height: 0.9;
      color: var(--text-primary);
      letter-spacing: -3px;
    }
    .temp-large .unit {
      font-size: 28px;
      font-weight: 400;
      color: var(--text-muted);
      margin-left: 4px;
      letter-spacing: 0;
    }
    .temp-feels {
      font-size: 13px;
      color: var(--text-secondary);
      padding-bottom: 12px;
    }
    .temp-feels .label {
      display: block;
      font-size: 10px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-bottom: 2px;
    }

    /* Stat grid */
    .stat-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }
    .stat-card {
      background: var(--bg-elev);
      border: 1px solid var(--border-subtle);
      border-radius: 14px;
      padding: 14px 12px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-width: 0;
    }
    .stat-card .stat-icon {
      width: 16px;
      height: 16px;
      color: var(--accent-blue);
      margin-bottom: 4px;
    }
    .stat-card .stat-icon svg {
      width: 100%;
      height: 100%;
    }
    .stat-card .stat-label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .stat-card .stat-value {
      font-family: "Orbitron", sans-serif;
      font-weight: 500;
      font-size: 19px;
      color: var(--text-primary);
      letter-spacing: -0.5px;
      white-space: nowrap;
    }
    .stat-card .stat-value .unit {
      font-size: 11px;
      color: var(--text-muted);
      margin-left: 2px;
      font-weight: 400;
    }
    .stat-card.amber .stat-icon,
    .stat-card.amber .stat-value { color: var(--color-amber); }
    .stat-card.red .stat-icon,
    .stat-card.red .stat-value { color: var(--color-red); }

    /* Detail list */
    .detail-list {
      background: var(--bg-elev);
      border: 1px solid var(--border-subtle);
      border-radius: 14px;
      padding: 4px 14px;
    }
    .detail-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid var(--border-subtle);
      font-size: 13px;
    }
    .detail-row:last-child { border-bottom: 0; }
    .detail-row .label { color: var(--text-secondary); }
    .detail-row .value {
      color: var(--text-primary);
      font-weight: 500;
      font-variant-numeric: tabular-nums;
    }
    .detail-row .value.amber { color: var(--color-amber); }
    .detail-row .value.red { color: var(--color-red); }
    .detail-row .value.muted { color: var(--text-muted); }

    /* Section heading */
    .section-heading {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1.2px;
      color: var(--text-muted);
      font-weight: 600;
      padding: 4px 2px 8px;
      display: flex;
      justify-content: space-between;
      align-items: baseline;
    }
    .section-heading .meta {
      font-family: "Orbitron", sans-serif;
      font-size: 11px;
      letter-spacing: 0;
      color: var(--text-secondary);
      font-weight: 400;
      text-transform: none;
    }

    /* Precipitation chart */
    .chart-card {
      background: var(--bg-elev);
      border: 1px solid var(--border-subtle);
      border-radius: 14px;
      padding: 14px;
    }
    .chart-precip {
      display: flex;
      gap: 4px;
      align-items: stretch;
    }
    .bar-col {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      min-width: 0;
    }
    .bar-pct {
      font-family: "Orbitron", sans-serif;
      font-weight: 500;
      font-size: 10px;
      color: var(--text-secondary);
      font-variant-numeric: tabular-nums;
      height: 12px;
      line-height: 12px;
    }
    .bar-pct.amber { color: var(--color-amber); }
    .bar-pct.red   { color: var(--color-red); }
    .bar-track {
      width: 100%;
      height: 96px;
      position: relative;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      border-bottom: 1px solid var(--border-subtle);
    }
    .bar {
      width: 72%;
      background: var(--accent-blue);
      border-radius: 4px 4px 0 0;
      min-height: 2px;
      transition: height 0.4s ease, background-color 0.3s ease;
    }
    .bar.amber { background: var(--color-amber); }
    .bar.red   { background: var(--color-red); }
    .bar-time {
      font-size: 10px;
      color: var(--text-muted);
      font-variant-numeric: tabular-nums;
    }

    /* Compass */
    .compass-card {
      background: var(--bg-elev);
      border: 1px solid var(--border-subtle);
      border-radius: 14px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }
    .compass-wrap {
      position: relative;
      width: 180px;
      height: 180px;
    }
    .compass {
      width: 100%;
      height: 100%;
    }
    .compass .ring-outer {
      fill: rgba(0, 0, 0, 0.018);
      stroke: var(--border-strong);
      stroke-width: 1;
    }
    .compass .ring-inner {
      fill: none;
      stroke: var(--border-subtle);
      stroke-width: 1;
      stroke-dasharray: 3 4;
    }
    .compass .tick {
      stroke: var(--text-faint);
      stroke-width: 1;
    }
    .compass .tick-major {
      stroke: var(--text-muted);
      stroke-width: 1.5;
    }
    .compass .cardinal {
      fill: var(--text-secondary);
      font-family: "Inter", sans-serif;
      font-size: 12px;
      font-weight: 600;
      text-anchor: middle;
      dominant-baseline: central;
    }
    .compass .cardinal.n { fill: var(--accent-blue); }
    .compass .needle {
      transition: transform 0.7s cubic-bezier(0.4, 1.3, 0.6, 1);
      transform-origin: 100px 100px;
    }
    .compass .needle-arrow { fill: var(--accent-blue); }
    .compass .needle-tail  { fill: rgba(0, 0, 0, 0.12); }
    .compass .hub          { fill: var(--text-primary); }
    .compass-center {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, calc(-50% + 28px));
      text-align: center;
      font-family: "Orbitron", sans-serif;
      font-size: 11px;
      color: var(--text-secondary);
      letter-spacing: 0.5px;
      pointer-events: none;
    }

    /* ===== Bottom bar ===== */
    .bottom-bar {
      position: fixed;
      bottom: 20px;
      left: 20px;
      right: 20px;
      z-index: 50;
      padding: 12px 20px;
      background: var(--bg-card);
      backdrop-filter: blur(28px);
      -webkit-backdrop-filter: blur(28px);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-card);
      box-shadow: var(--shadow-md);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }
    .bottom-section {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .bottom-section.center {
      flex: 1;
      justify-content: center;
    }

    .track-state {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 12px;
      border-radius: 9px;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.2px;
    }
    .track-state .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .track-state.dry {
      background: rgba(16, 185, 129, 0.12);
      border: 1px solid rgba(16, 185, 129, 0.32);
      color: var(--color-green);
    }
    .track-state.dry .dot {
      background: var(--color-green);
      box-shadow: 0 0 8px rgba(16, 185, 129, 0.55);
      animation: pulse-soft 1.6s ease-in-out infinite;
    }
    .track-state.damp {
      background: rgba(245, 158, 11, 0.12);
      border: 1px solid rgba(245, 158, 11, 0.32);
      color: var(--color-amber);
    }
    .track-state.damp .dot {
      background: var(--color-amber);
      box-shadow: 0 0 8px rgba(245, 158, 11, 0.55);
      animation: pulse-soft 1s ease-in-out infinite;
    }
    .track-state.wet {
      background: rgba(239, 68, 68, 0.12);
      border: 1px solid rgba(239, 68, 68, 0.32);
      color: var(--color-red);
    }
    .track-state.wet .dot {
      background: var(--color-red);
      box-shadow: 0 0 8px rgba(239, 68, 68, 0.55);
      animation: pulse-soft 0.6s ease-in-out infinite;
    }
    .track-state.standby {
      background: rgba(0, 0, 0, 0.04);
      border: 1px solid var(--border-subtle);
      color: var(--text-muted);
    }
    .track-state.standby .dot {
      background: var(--text-muted);
    }

    .metric-list {
      display: inline-flex;
      align-items: center;
    }
    .metric {
      display: inline-flex;
      align-items: baseline;
      gap: 7px;
      padding: 0 16px;
      font-variant-numeric: tabular-nums;
    }
    .metric + .metric {
      border-left: 1px solid var(--border-subtle);
    }
    .metric-label {
      font-size: 10px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }
    .metric-value {
      font-weight: 600;
      color: var(--text-primary);
      font-size: 13px;
    }
    .metric-value.amber { color: var(--color-amber); }
    .metric-value.red   { color: var(--color-red); }
    .metric-value.muted { color: var(--text-muted); }

    .coords {
      font-family: "Orbitron", sans-serif;
      font-size: 11px;
      color: var(--text-secondary);
      font-variant-numeric: tabular-nums;
    }
    .coords .label {
      color: var(--text-muted);
      margin-right: 4px;
      font-family: "Inter", sans-serif;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      font-weight: 500;
    }
    .coords .sep {
      color: var(--text-faint);
      margin: 0 8px;
    }

    /* ===== Map controls ===== */
    .map-controls {
      position: fixed;
      bottom: 100px;
      right: 400px;
      z-index: 45;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .map-btn {
      width: 42px;
      height: 42px;
      background: var(--overlay-dark);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid var(--overlay-dark-border);
      border-radius: var(--radius-btn);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s ease, border-color 0.2s ease, color 0.2s ease, transform 0.1s ease;
      box-shadow: var(--shadow-overlay);
    }
    .map-btn:hover {
      background: var(--overlay-dark-strong);
      border-color: rgba(255, 255, 255, 0.22);
    }
    .map-btn:active { transform: scale(0.96); }
    .map-btn.active {
      background: var(--accent-blue);
      border-color: var(--accent-blue);
      color: white;
      box-shadow: 0 4px 14px rgba(59, 130, 246, 0.45);
    }
    .map-btn svg {
      width: 18px;
      height: 18px;
    }

    /* ===== Update toast ===== */
    .update-toast {
      position: fixed;
      bottom: 92px;
      left: 50%;
      transform: translate(-50%, 10px);
      z-index: 60;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 18px;
      background: var(--overlay-dark-strong);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid var(--accent-blue-border);
      border-radius: 10px;
      box-shadow: 0 6px 22px rgba(59, 130, 246, 0.3);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.3px;
      color: white;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease, transform 0.3s ease;
    }
    .update-toast.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }
    .update-toast::before {
      content: "";
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent-blue);
      box-shadow: 0 0 8px var(--accent-blue);
    }
  </style>
</head>
<body>
  <div id="map"></div>

  <header class="top-bar">
    <div class="brand">Race<span class="accent">Weather</span></div>
    <nav class="tabs" id="tabs"></nav>
    <div class="right-controls">
      <span class="live-pill">Live</span>
      <span id="clock" class="clock-text">--:--:--</span>
    </div>
  </header>

  <aside class="panel panel-left">
    <div class="panel-body" id="panel-current">
      <div class="panel-placeholder"><span class="dot"></span>Standby</div>
    </div>
  </aside>

  <aside class="panel panel-right">
    <div class="panel-body" id="panel-forecast">
      <div class="panel-placeholder"><span class="dot"></span>Standby</div>
    </div>
  </aside>

  <footer class="bottom-bar" id="bottom-strip"></footer>

  <div class="map-controls">
    <button class="map-btn" id="zoom-in" aria-label="Zoom in" title="Zoom in">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
    </button>
    <button class="map-btn" id="zoom-out" aria-label="Zoom out" title="Zoom out">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 12h14"/></svg>
    </button>
    <button class="map-btn" id="precip-toggle" aria-label="Toggle precipitation" title="Toggle precipitation layer">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M16 13v8M8 13v8M12 15v8M20 16.58A5 5 0 0 0 18 7h-1.26A8 8 0 1 0 4 15.25"/></svg>
    </button>
  </div>

  <div id="update-toast" class="update-toast">Updated</div>

  <script>
    // ===== Circuit data =====
    const CIRCUITS = [
      { id: "imola",      name: "Imola",      tab: "Imola",      full: "Autodromo Enzo e Dino Ferrari", country: "Italy",   flag: "🇮🇹", lat:  44.3439, lng:  11.7167, elev:  47 },
      { id: "spa",        name: "Spa",        tab: "Spa",        full: "Circuit de Spa-Francorchamps",  country: "Belgium", flag: "🇧🇪", lat:  50.4372, lng:   5.9714, elev: 401 },
      { id: "lemans",     name: "Le Mans",    tab: "Le Mans",    full: "Circuit de la Sarthe",          country: "France",  flag: "🇫🇷", lat:  47.9562, lng:   0.2075, elev:  62 },
      { id: "interlagos", name: "Interlagos", tab: "Interlagos", full: "Autódromo José Carlos Pace",    country: "Brazil",  flag: "🇧🇷", lat: -23.7036, lng: -46.6997, elev: 750 },
      { id: "cota",       name: "COTA",       tab: "COTA",       full: "Circuit of the Americas",       country: "USA",     flag: "🇺🇸", lat:  30.1328, lng: -97.6411, elev: 163 },
      { id: "fuji",       name: "Fuji",       tab: "Fuji",       full: "Fuji Speedway",                 country: "Japan",   flag: "🇯🇵", lat:  35.3725, lng: 138.9267, elev: 560 },
      { id: "lusail",     name: "Lusail",     tab: "Qatar",      full: "Lusail International Circuit",  country: "Qatar",   flag: "🇶🇦", lat:  25.4900, lng:  51.4543, elev:   8 },
      { id: "bahrain",    name: "Bahrain",    tab: "Bahrain",    full: "Bahrain International Circuit", country: "Bahrain", flag: "🇧🇭", lat:  26.0325, lng:  50.5106, elev:   7 },
    ];

    const CIRCUIT_ZOOM = 14;

    // ===== Icons =====
    const ICONS = {
      thermometer: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 14.76V3.5a2.5 2.5 0 0 0-5 0v11.26a4.5 4.5 0 1 0 5 0z"/></svg>',
      rain: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M16 13v8M8 13v8M12 15v8M20 16.58A5 5 0 0 0 18 7h-1.26A8 8 0 1 0 4 15.25"/></svg>',
      wind: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17.7 7.7a2.5 2.5 0 1 1 1.8 4.3H2M9.6 4.6A2 2 0 1 1 11 8H2m10.6 11.4A2 2 0 1 0 14 16H2"/></svg>',
      arrow: '<svg viewBox="0 0 24 24"><path d="M12 2 L5 16 L12 13 L19 16 Z"/></svg>',
    };

    // ===== Map init =====
    // Manual pan / zoom re-enabled; default controls hidden in favor of
    // the custom buttons in .map-controls.
    const map = L.map("map", {
      zoomControl: false,
      attributionControl: false,
      worldCopyJump: true,
      preferCanvas: true,
    });

    L.tileLayer(
      "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
      { maxZoom: 18 }
    ).addTo(map);

    const ALL_CIRCUITS_BOUNDS = L.latLngBounds(
      CIRCUITS.map((c) => [c.lat, c.lng])
    ).pad(0.25);
    map.fitBounds(ALL_CIRCUITS_BOUNDS, { animate: false });

    // Custom zoom buttons
    document.getElementById("zoom-in").addEventListener("click", () => map.zoomIn());
    document.getElementById("zoom-out").addEventListener("click", () => map.zoomOut());

    // Circuit markers
    const pulseIcon = L.divIcon({
      className: "",
      html: `<div class="circuit-marker"><div class="ring"></div><div class="core"></div></div>`,
      iconSize: [16, 16],
      iconAnchor: [8, 8],
    });

    const mapLabelLayer = L.layerGroup().addTo(map);
    const precipLayer = L.layerGroup();
    let precipLayerActive = false;

    function makeMapLabelIcon(c) {
      // Open-Meteo wind_direction = direction wind is coming FROM.
      // Arrow points in the direction wind is BLOWING TO → rotate by deg + 180.
      const dir = c.weather?.current?.wind_direction_10m;
      const temp = c.weather?.current?.temperature_2m;
      const rot = (dir ?? 0) + 180;
      const tempText = temp == null ? "—" : `${Math.round(temp)}°`;
      return L.divIcon({
        className: "",
        html: `<div class="map-label-anchor"><div class="map-label"><span class="arrow" style="transform: rotate(${rot}deg)">${ICONS.arrow}</span><span class="temp">${tempText}</span></div></div>`,
        iconSize: [80, 24],
        iconAnchor: [40, 40],
      });
    }

    function updateMapLabels() {
      mapLabelLayer.clearLayers();
      CIRCUITS.forEach((c) => {
        if (!c.weather) return;
        L.marker([c.lat, c.lng], {
          icon: makeMapLabelIcon(c),
          interactive: false,
          keyboard: false,
        }).addTo(mapLabelLayer);
      });
    }

    function updatePrecipLayer() {
      precipLayer.clearLayers();
      if (!precipLayerActive) return;
      CIRCUITS.forEach((c) => {
        if (!c.weather) return;
        const idx = currentHourIndex(c.weather);
        const prob = idx >= 0 ? c.weather.hourly?.precipitation_probability?.[idx] : null;
        if (prob == null) return;
        const color = prob > 60 ? "#ef4444" : prob > 30 ? "#f59e0b" : "#3b82f6";
        const fillOpacity = 0.1 + Math.min(prob, 100) / 100 * 0.4;
        L.circle([c.lat, c.lng], {
          radius: 70000,
          color,
          fillColor: color,
          fillOpacity,
          weight: 1,
          opacity: 0.55,
          interactive: false,
        }).addTo(precipLayer);
      });
    }

    function togglePrecipLayer() {
      precipLayerActive = !precipLayerActive;
      const btn = document.getElementById("precip-toggle");
      if (precipLayerActive) {
        map.addLayer(precipLayer);
        btn.classList.add("active");
      } else {
        map.removeLayer(precipLayer);
        btn.classList.remove("active");
      }
      updatePrecipLayer();
    }
    document.getElementById("precip-toggle").addEventListener("click", togglePrecipLayer);

    // ===== Tabs + markers (shared activation) =====
    const tabsEl = document.getElementById("tabs");
    const tabNodes = new Map();
    const markerNodes = new Map();
    let activeCircuitId = null;

    function setActiveCircuit(id, { fly = true } = {}) {
      activeCircuitId = id;

      tabNodes.forEach((node, key) => {
        node.classList.toggle("active", key === id);
      });

      const c = CIRCUITS.find((x) => x.id === id);
      if (fly && c) {
        map.flyTo([c.lat, c.lng], CIRCUIT_ZOOM, { duration: 1.8 });
      }

      renderPanels();
      ensureCircuitWeather(c);
    }

    CIRCUITS.forEach((c) => {
      const tab = document.createElement("button");
      tab.type = "button";
      tab.className = "tab";
      tab.dataset.circuit = c.id;
      tab.innerHTML = `<span class="flag">${c.flag}</span><span>${c.tab}</span>`;
      tab.addEventListener("click", () => setActiveCircuit(c.id));
      tabsEl.appendChild(tab);
      tabNodes.set(c.id, tab);

      const marker = L.marker([c.lat, c.lng], { icon: pulseIcon }).addTo(map);
      marker.bindTooltip(`${c.flag}  ${c.name}`, {
        className: "circuit-tooltip",
        direction: "top",
        offset: [0, -10],
      });
      marker.on("click", () => setActiveCircuit(c.id));
      markerNodes.set(c.id, marker);
    });

    // ===== Clock =====
    function updateClock() {
      const now = new Date();
      const hh = String(now.getUTCHours()).padStart(2, "0");
      const mm = String(now.getUTCMinutes()).padStart(2, "0");
      const ss = String(now.getUTCSeconds()).padStart(2, "0");
      document.getElementById("clock").textContent = `${hh}:${mm}:${ss} UTC`;
    }
    updateClock();
    setInterval(updateClock, 1000);

    // ===== Open-Meteo weather fetch (lazy + cached) =====
    const WEATHER_API = "https://api.open-meteo.com/v1/forecast";
    const CACHE_TTL_MS = 10 * 60 * 1000;

    const CURRENT_VARS = [
      "temperature_2m", "relative_humidity_2m", "apparent_temperature",
      "precipitation", "rain", "weather_code", "cloud_cover",
      "surface_pressure", "wind_speed_10m", "wind_direction_10m",
      "wind_gusts_10m", "is_day", "dew_point_2m",
    ];
    const HOURLY_VARS = [
      "temperature_2m", "precipitation_probability", "weather_code",
      "wind_speed_10m", "soil_temperature_0cm", "visibility",
    ];
    const DAILY_VARS = [
      "sunrise", "sunset", "uv_index_max",
      "temperature_2m_max", "temperature_2m_min",
    ];

    function buildWeatherURL(c) {
      const params = new URLSearchParams({
        latitude: c.lat,
        longitude: c.lng,
        current: CURRENT_VARS.join(","),
        hourly: HOURLY_VARS.join(","),
        daily: DAILY_VARS.join(","),
        forecast_days: "2",
        timezone: "auto",
      });
      return `${WEATHER_API}?${params}`;
    }

    async function fetchCircuitWeather(c) {
      const res = await fetch(buildWeatherURL(c));
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      return res.json();
    }

    function isCacheFresh(c) {
      return (
        c.weather &&
        c.weatherFetchedAt &&
        Date.now() - c.weatherFetchedAt < CACHE_TTL_MS
      );
    }

    async function ensureCircuitWeather(c) {
      if (!c) return;
      if (isCacheFresh(c)) return;
      if (c.weatherLoading) return;

      c.weatherLoading = true;
      if (activeCircuitId === c.id) renderPanels();

      const t0 = performance.now();
      let updated = false;
      try {
        const data = await fetchCircuitWeather(c);
        c.weather = data;
        c.weatherFetchedAt = Date.now();
        updated = true;
        const dt = (performance.now() - t0).toFixed(0);
        console.log(`[RaceWeather] ${c.id} fetched in ${dt}ms`, {
          tempC: data.current?.temperature_2m,
          rainMM: data.current?.precipitation,
          windKmh: data.current?.wind_speed_10m,
          windDir: data.current?.wind_direction_10m,
          weatherCode: data.current?.weather_code,
        });
      } catch (err) {
        console.warn(`[RaceWeather] ${c.id} fetch failed — keeping last data`, err);
      } finally {
        c.weatherLoading = false;
        if (activeCircuitId === c.id) renderPanels();
        if (updated && activeCircuitId === c.id) showUpdateToast();
        updateMapLabels();
        updatePrecipLayer();
      }
    }

    let updateToastTimer = null;
    function showUpdateToast() {
      const el = document.getElementById("update-toast");
      if (!el) return;
      el.classList.add("show");
      clearTimeout(updateToastTimer);
      updateToastTimer = setTimeout(() => el.classList.remove("show"), 2000);
    }

    window.CIRCUITS = CIRCUITS;

    // ===== WMO weather code → text (title case) =====
    const WMO_CODES = {
      0:  "Clear sky",
      1:  "Mainly clear",
      2:  "Partly cloudy",
      3:  "Overcast",
      45: "Fog",
      48: "Rime fog",
      51: "Light drizzle",
      53: "Drizzle",
      55: "Dense drizzle",
      56: "Freezing drizzle",
      57: "Freezing drizzle",
      61: "Light rain",
      63: "Rain",
      65: "Heavy rain",
      66: "Freezing rain",
      67: "Freezing rain",
      71: "Light snow",
      73: "Snow",
      75: "Heavy snow",
      77: "Snow grains",
      80: "Light showers",
      81: "Showers",
      82: "Violent showers",
      85: "Snow showers",
      86: "Heavy snow showers",
      95: "Thunderstorm",
      96: "Thunderstorm + hail",
      99: "Severe thunderstorm",
    };
    const weatherCodeText = (code) => WMO_CODES[code] ?? `Code ${code}`;

    // ===== Helpers =====
    function uvLabel(uv) {
      if (uv == null) return { text: "—", cls: "muted" };
      const n = uv.toFixed(0);
      if (uv >= 11) return { text: `Extreme ${n}`,   cls: "red" };
      if (uv >= 8)  return { text: `Very high ${n}`, cls: "red" };
      if (uv >= 6)  return { text: `High ${n}`,      cls: "amber" };
      if (uv >= 3)  return { text: `Moderate ${n}`,  cls: "" };
      return { text: `Low ${n}`, cls: "" };
    }

    function classifyValue(v, { red, amber, low } = {}) {
      if (v == null || Number.isNaN(v)) return "muted";
      if (red != null && v >= red) return "red";
      if (amber != null && v >= amber) return "amber";
      if (low != null && v <= low) return "amber";
      return "";
    }

    function formatHM(iso) {
      if (!iso) return "—";
      const m = iso.match(/T(\d{2}:\d{2})/);
      return m ? m[1] : iso;
    }

    function currentHourIndex(weather) {
      const t = weather?.current?.time;
      const arr = weather?.hourly?.time;
      if (!t || !arr) return -1;
      const hourKey = t.slice(0, 13) + ":00";
      const hit = arr.indexOf(hourKey);
      if (hit >= 0) return hit;
      for (let i = arr.length - 1; i >= 0; i--) {
        if (arr[i] <= t) return i;
      }
      return 0;
    }

    function detailRow(label, value, cls = "") {
      return `<div class="detail-row"><span class="label">${label}</span><span class="value ${cls}">${value}</span></div>`;
    }

    // ===== Wind helpers =====
    const DIR_NAMES = [
      "N","NNE","NE","ENE","E","ESE","SE","SSE",
      "S","SSW","SW","WSW","W","WNW","NW","NNW",
    ];
    function dirName(deg) {
      if (deg == null || Number.isNaN(deg)) return "—";
      const n = ((deg % 360) + 360) % 360;
      return DIR_NAMES[Math.round(n / 22.5) % 16];
    }

    function beaufort(kmh) {
      if (kmh == null || Number.isNaN(kmh)) return { n: null, name: "—" };
      const v = kmh;
      if (v < 1)   return { n: 0,  name: "Calm" };
      if (v < 6)   return { n: 1,  name: "Light air" };
      if (v < 12)  return { n: 2,  name: "Light breeze" };
      if (v < 20)  return { n: 3,  name: "Gentle breeze" };
      if (v < 29)  return { n: 4,  name: "Moderate breeze" };
      if (v < 39)  return { n: 5,  name: "Fresh breeze" };
      if (v < 50)  return { n: 6,  name: "Strong breeze" };
      if (v < 62)  return { n: 7,  name: "Near gale" };
      if (v < 75)  return { n: 8,  name: "Gale" };
      if (v < 89)  return { n: 9,  name: "Strong gale" };
      if (v < 103) return { n: 10, name: "Storm" };
      if (v < 118) return { n: 11, name: "Violent storm" };
      return { n: 12, name: "Hurricane" };
    }

    function build12hPrecip(weather) {
      const arr = weather?.hourly?.time;
      const probs = weather?.hourly?.precipitation_probability;
      const start = currentHourIndex(weather);
      if (!arr || !probs || start < 0) return [];
      const out = [];
      for (let i = 0; i < 12 && start + i < arr.length; i++) {
        const t = arr[start + i];
        out.push({ hour: t.slice(11, 13), pct: probs[start + i] ?? 0 });
      }
      return out;
    }

    function buildCompassSVG(dirDeg) {
      const cx = 100, cy = 100, R = 92;
      const ticks = [];
      for (let a = 0; a < 360; a += 15) {
        const major = a % 90 === 0;
        const len = major ? 10 : 5;
        const rad = ((a - 90) * Math.PI) / 180;
        const x1 = cx + R * Math.cos(rad);
        const y1 = cy + R * Math.sin(rad);
        const x2 = cx + (R - len) * Math.cos(rad);
        const y2 = cy + (R - len) * Math.sin(rad);
        ticks.push(`<line class="tick${major ? " tick-major" : ""}" x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}"/>`);
      }
      const rot = dirDeg ?? 0;
      return `
        <svg class="compass" viewBox="0 0 200 200" aria-hidden="true">
          <circle class="ring-outer" cx="100" cy="100" r="92"/>
          <circle class="ring-inner" cx="100" cy="100" r="74"/>
          ${ticks.join("")}
          <text class="cardinal n" x="100" y="14">N</text>
          <text class="cardinal"   x="186" y="100">E</text>
          <text class="cardinal"   x="100" y="186">S</text>
          <text class="cardinal"   x="14"  y="100">W</text>
          <g class="needle" style="transform: rotate(${rot}deg)">
            <polygon class="needle-arrow" points="100,26 92,100 108,100"/>
            <polygon class="needle-tail"  points="92,100 108,100 100,158"/>
          </g>
          <circle class="hub" cx="100" cy="100" r="5"/>
        </svg>
      `;
    }

    // ===== Render: left panel =====
    function renderCurrentPanel() {
      const el = document.getElementById("panel-current");
      const c = CIRCUITS.find((x) => x.id === activeCircuitId);

      if (!c) {
        el.innerHTML = `<div class="panel-placeholder"><span class="dot"></span>Select a circuit</div>`;
        return;
      }
      if (!c.weather) {
        el.innerHTML = `
          <div class="circuit-id">
            <span class="flag">${c.flag}</span>
            <div>
              <div class="name">${c.name}</div>
              <div class="full">${c.full}</div>
            </div>
          </div>
          <div class="panel-placeholder"><span class="dot"></span>Loading data…</div>`;
        return;
      }

      const w = c.weather;
      const cur = w.current ?? {};
      const hr = w.hourly ?? {};
      const dy = w.daily ?? {};
      const hIdx = currentHourIndex(w);

      const precipProb = hIdx >= 0 ? hr.precipitation_probability?.[hIdx] : null;
      const soilTemp   = hIdx >= 0 ? hr.soil_temperature_0cm?.[hIdx]      : null;

      const uv = uvLabel(dy.uv_index_max?.[0]);

      const soilStatCls = classifyValue(soilTemp,   { red: 50, amber: 40, low: 15 });
      const rainStatCls = classifyValue(precipProb, { red: 70, amber: 40 });
      const windStatCls = classifyValue(cur.wind_speed_10m, { red: 60, amber: 40 });

      const temp     = cur.temperature_2m;
      const feels    = cur.apparent_temperature;
      const humidity = cur.relative_humidity_2m;
      const pressure = cur.surface_pressure;
      const clouds   = cur.cloud_cover;
      const dew      = cur.dew_point_2m;
      const wind     = cur.wind_speed_10m;
      const isDay    = cur.is_day === 1;
      const wcText   = weatherCodeText(cur.weather_code);

      const fmt = (v, digits = 0, suffix = "") =>
        v == null || Number.isNaN(v) ? "—" : `${v.toFixed(digits)}${suffix}`;

      el.innerHTML = `
        <div class="circuit-id">
          <span class="flag">${c.flag}</span>
          <div>
            <div class="name">${c.name}</div>
            <div class="full">${c.full}</div>
          </div>
        </div>

        <div class="conditions-card">
          <div class="conditions-tags">
            <span class="cond-pill accent"><span class="dot"></span>${wcText}</span>
            <span class="cond-pill">${isDay ? "Day" : "Night"}</span>
            ${c.weatherLoading ? '<span class="cond-pill amber"><span class="dot"></span>Refreshing</span>' : ""}
          </div>
          <div class="temp-main">
            <div class="temp-large">${fmt(temp, 0)}<span class="unit">°C</span></div>
            <div class="temp-feels">
              <span class="label">Feels like</span>
              ${fmt(feels, 1, " °C")}
            </div>
          </div>
        </div>

        <div class="stat-grid">
          <div class="stat-card ${soilStatCls}">
            <span class="stat-icon">${ICONS.thermometer}</span>
            <span class="stat-label">Surface</span>
            <span class="stat-value">${fmt(soilTemp, 0)}<span class="unit">°C</span></span>
          </div>
          <div class="stat-card ${rainStatCls}">
            <span class="stat-icon">${ICONS.rain}</span>
            <span class="stat-label">Rain prob.</span>
            <span class="stat-value">${fmt(precipProb, 0)}<span class="unit">%</span></span>
          </div>
          <div class="stat-card ${windStatCls}">
            <span class="stat-icon">${ICONS.wind}</span>
            <span class="stat-label">Wind</span>
            <span class="stat-value">${fmt(wind, 0)}<span class="unit">km/h</span></span>
          </div>
        </div>

        <div class="detail-list">
          ${detailRow("Humidity",   fmt(humidity, 0, "%"))}
          ${detailRow("Pressure",   fmt(pressure, 0, " hPa"))}
          ${detailRow("Cloud cover", fmt(clouds, 0, "%"))}
          ${detailRow("UV index",   uv.text, uv.cls)}
          ${detailRow("Dew point",  fmt(dew, 1, " °C"))}
          ${detailRow("Sunrise",    formatHM(dy.sunrise?.[0]))}
          ${detailRow("Sunset",     formatHM(dy.sunset?.[0]))}
        </div>
      `;
    }

    // ===== Render: right panel =====
    function renderForecastPanel() {
      const el = document.getElementById("panel-forecast");
      const c = CIRCUITS.find((x) => x.id === activeCircuitId);

      if (!c) {
        el.innerHTML = `<div class="panel-placeholder"><span class="dot"></span>Select a circuit</div>`;
        return;
      }
      if (!c.weather) {
        el.innerHTML = `<div class="panel-placeholder"><span class="dot"></span>Loading data…</div>`;
        return;
      }

      const w = c.weather;
      const cur = w.current ?? {};

      const series = build12hPrecip(w);
      const chartHTML = series.length
        ? series.map(({ hour, pct }) => {
            const v = Number.isFinite(pct) ? pct : 0;
            const cls = v >= 60 ? "red" : v >= 30 ? "amber" : "";
            const h = Math.max(2, Math.min(100, v));
            return `
              <div class="bar-col">
                <div class="bar-pct ${cls}">${v}</div>
                <div class="bar-track"><div class="bar ${cls}" style="height: ${h}%"></div></div>
                <div class="bar-time">${hour}</div>
              </div>`;
          }).join("")
        : `<div class="bar-col"><div class="bar-pct">—</div><div class="bar-track"></div><div class="bar-time">—</div></div>`;

      const ws    = cur.wind_speed_10m;
      const gust  = cur.wind_gusts_10m;
      const dDeg  = cur.wind_direction_10m;
      const dTxt  = dirName(dDeg);
      const bft   = beaufort(ws);

      const speedCls = classifyValue(ws,   { red: 50, amber: 30 });
      const gustCls  = classifyValue(gust, { red: 60, amber: 40 });

      const fmt = (v, digits = 0, suffix = "") =>
        v == null || Number.isNaN(v) ? "—" : `${v.toFixed(digits)}${suffix}`;

      const dirMeta = dDeg == null ? "—" : `${dTxt} · ${Math.round(dDeg)}°`;

      el.innerHTML = `
        <div class="section-heading">
          <span>12-hour precipitation</span>
          <span class="meta">Probability %</span>
        </div>
        <div class="chart-card">
          <div class="chart-precip">${chartHTML}</div>
        </div>

        <div class="section-heading">
          <span>Wind</span>
          <span class="meta">${dirMeta}</span>
        </div>
        <div class="compass-card">
          <div class="compass-wrap">
            ${buildCompassSVG(dDeg)}
            <div class="compass-center">${dDeg == null ? "—" : Math.round(dDeg) + "°"}</div>
          </div>
        </div>

        <div class="detail-list">
          ${detailRow("Wind speed", fmt(ws,   1, " km/h"), speedCls)}
          ${detailRow("Gusts",      fmt(gust, 1, " km/h"), gustCls)}
          ${detailRow("Direction",  dirMeta)}
          ${detailRow("Beaufort",   bft.n == null ? "—" : `${bft.n} · ${bft.name}`)}
        </div>
      `;
    }

    // ===== Track status helpers =====
    function trackState(precipProb, precipMM) {
      const prob = precipProb ?? 0;
      const mm = precipMM ?? 0;
      if (prob > 60 || mm >= 0.5) return "Wet";
      if (prob >= 20 || mm > 0)   return "Damp";
      return "Dry";
    }

    function gripLevel(state, surfaceTemp, windKmh) {
      if (state === "Wet" && (windKmh ?? 0) > 40) return "Very low";
      if (state === "Wet")  return "Low";
      if (state === "Damp") return "Medium";
      if (surfaceTemp == null) return "Medium";
      if (surfaceTemp < 20 || surfaceTemp > 50) return "Medium";
      return "High";
    }

    function nextRainText(weather) {
      const cur = weather?.current ?? {};
      const probs = weather?.hourly?.precipitation_probability;
      if ((cur.precipitation ?? 0) > 0) return "Now";
      const idx = currentHourIndex(weather);
      if (idx < 0 || !probs) return "—";
      for (let i = 1; i < 24 && idx + i < probs.length; i++) {
        if ((probs[idx + i] ?? 0) > 50) return `+${i}h`;
      }
      return "—";
    }

    function metric(label, value, cls = "") {
      return `<span class="metric"><span class="metric-label">${label}</span><span class="metric-value ${cls}">${value}</span></span>`;
    }

    // ===== Render: bottom bar =====
    function renderBottomStrip() {
      const stripEl = document.getElementById("bottom-strip");
      const c = CIRCUITS.find((x) => x.id === activeCircuitId);

      const coordsHTML = c
        ? `<span class="coords">
            <span class="label">Lat</span>${c.lat.toFixed(4)}°
            <span class="sep">·</span>
            <span class="label">Lng</span>${c.lng.toFixed(4)}°
            <span class="sep">·</span>
            <span class="label">Alt</span>${c.elev} m
          </span>`
        : "";

      if (!c || !c.weather) {
        stripEl.innerHTML = `
          <div class="bottom-section">
            <span class="track-state standby">
              <span class="dot"></span>${c ? "Loading…" : "Standby"}
            </span>
          </div>
          <div class="bottom-section center"></div>
          <div class="bottom-section">${coordsHTML}</div>`;
        return;
      }

      const cur = c.weather.current ?? {};
      const hr = c.weather.hourly ?? {};
      const idx = currentHourIndex(c.weather);

      const precipProb = idx >= 0 ? hr.precipitation_probability?.[idx] : null;
      const soilTemp   = idx >= 0 ? hr.soil_temperature_0cm?.[idx]      : null;
      const visMeters  = idx >= 0 ? hr.visibility?.[idx]                : null;
      const visKm      = visMeters != null ? visMeters / 1000 : null;
      const wind       = cur.wind_speed_10m;
      const precipMM   = cur.precipitation;

      const state = trackState(precipProb, precipMM);
      const grip  = gripLevel(state, soilTemp, wind);
      const stateCls = state.toLowerCase();

      const surfCls = classifyValue(soilTemp,   { red: 50, amber: 40, low: 15 });
      const windCls = classifyValue(wind,       { red: 60, amber: 40 });
      const rainCls = classifyValue(precipProb, { red: 60, amber: 20 });
      const visCls  = visKm == null ? "muted" : visKm < 5 ? "red" : visKm < 10 ? "amber" : "";
      const nextRain = nextRainText(c.weather);
      const nextCls =
        nextRain === "Now"                ? "red" :
        /^\+([123])h$/.test(nextRain)     ? "amber" :
        /^\+\d+h$/.test(nextRain)         ? "" : "muted";

      const fmt = (v, digits, suffix) =>
        v == null || Number.isNaN(v) ? "—" : `${v.toFixed(digits)}${suffix}`;

      stripEl.innerHTML = `
        <div class="bottom-section">
          <span class="track-state ${stateCls}">
            <span class="dot"></span>${state} · ${grip} grip
          </span>
        </div>
        <div class="bottom-section center">
          <div class="metric-list">
            ${metric("Surface",   fmt(soilTemp, 0, "°C"),  surfCls)}
            ${metric("Wind",      fmt(wind, 0, " km/h"),   windCls)}
            ${metric("Rain",      fmt(precipProb, 0, "%"), rainCls)}
            ${metric("Next rain", nextRain,                nextCls)}
            ${metric("Visibility",fmt(visKm, 0, " km"),    visCls)}
          </div>
        </div>
        <div class="bottom-section">${coordsHTML}</div>
      `;
    }

    function renderPanels() {
      renderCurrentPanel();
      renderForecastPanel();
      renderBottomStrip();
    }

    // ===== Boot =====
    renderPanels();
    setTimeout(() => setActiveCircuit("imola"), 1800);
  </script>
</body>
</html>

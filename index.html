<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RaceWeather — Tactical Race Weather Display</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@400;500;600;700&family=Share+Tech+Mono&display=swap"
    rel="stylesheet"
  />

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  />
  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
  ></script>

  <style>
    :root {
      --bg-deep: #020408;
      --bg-panel: rgba(4, 10, 18, 0.78);
      --hud-green: #00ff88;
      --hud-green-dim: rgba(0, 255, 136, 0.35);
      --hud-green-glow: rgba(0, 255, 136, 0.55);
      --hud-amber: #ffaa00;
      --hud-red: #ff3344;
      --hud-cyan: #00ddff;
      --grid-line: rgba(0, 255, 136, 0.08);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg-deep);
      color: var(--hud-green);
      font-family: "Rajdhani", "Share Tech Mono", monospace;
      cursor: none;
    }

    #app {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
    }

    /* ===== MAP ===== */
    #map {
      position: absolute;
      inset: 0;
      background: var(--bg-deep);
      z-index: 1;
    }

    .leaflet-container {
      background: #000;
      font-family: "Share Tech Mono", monospace;
    }

    .leaflet-control-attribution {
      background: rgba(2, 4, 8, 0.7) !important;
      color: rgba(0, 255, 136, 0.5) !important;
      font-size: 9px !important;
      letter-spacing: 0.5px;
    }
    .leaflet-control-attribution a {
      color: var(--hud-green) !important;
    }

    .leaflet-control-zoom a {
      background: var(--bg-panel) !important;
      color: var(--hud-green) !important;
      border: 1px solid var(--hud-green-dim) !important;
      font-family: "Orbitron", sans-serif !important;
      text-shadow: 0 0 6px var(--hud-green-glow);
    }
    .leaflet-control-zoom a:hover {
      background: rgba(0, 255, 136, 0.15) !important;
    }

    /* ===== CIRCUIT MARKERS (pulse) ===== */
    .circuit-marker {
      position: relative;
      width: 18px;
      height: 18px;
    }
    .circuit-marker .core {
      position: absolute;
      inset: 0;
      margin: auto;
      width: 10px;
      height: 10px;
      background: var(--hud-green);
      border-radius: 50%;
      box-shadow:
        0 0 8px var(--hud-green),
        0 0 18px var(--hud-green-glow),
        0 0 32px rgba(0, 255, 136, 0.35);
      z-index: 2;
    }
    .circuit-marker .ring {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 1.5px solid var(--hud-green);
      opacity: 0;
      animation: pulse-ring 2.4s ease-out infinite;
    }
    .circuit-marker .ring.delay {
      animation-delay: 1.2s;
    }

    @keyframes pulse-ring {
      0% {
        transform: scale(0.6);
        opacity: 0.9;
      }
      80% {
        transform: scale(3.5);
        opacity: 0;
      }
      100% {
        transform: scale(3.5);
        opacity: 0;
      }
    }

    /* Marker tooltip */
    .leaflet-tooltip.circuit-tooltip {
      background: var(--bg-panel);
      color: var(--hud-green);
      border: 1px solid var(--hud-green-dim);
      border-radius: 0;
      padding: 4px 10px;
      font-family: "Orbitron", sans-serif;
      font-weight: 700;
      font-size: 11px;
      letter-spacing: 2px;
      text-shadow: 0 0 6px var(--hud-green-glow);
      box-shadow: 0 0 14px rgba(0, 255, 136, 0.18);
    }
    .leaflet-tooltip.circuit-tooltip::before {
      display: none;
    }

    /* ===== HUD OVERLAYS ===== */

    /* Scanlines */
    .scanlines {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 1000;
      background: repeating-linear-gradient(
        to bottom,
        rgba(0, 255, 136, 0.025) 0px,
        rgba(0, 255, 136, 0.025) 1px,
        transparent 1px,
        transparent 3px
      );
      mix-blend-mode: screen;
    }

    /* Vignette */
    .vignette {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 999;
      background: radial-gradient(
        ellipse at center,
        transparent 55%,
        rgba(0, 0, 0, 0.6) 100%
      );
    }

    /* Grid overlay */
    .grid-overlay {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 998;
      background-image:
        linear-gradient(to right, var(--grid-line) 1px, transparent 1px),
        linear-gradient(to bottom, var(--grid-line) 1px, transparent 1px);
      background-size: 80px 80px;
      opacity: 0.6;
    }

    /* Corner brackets */
    .corner-brackets {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 1001;
    }
    .corner-brackets::before,
    .corner-brackets::after,
    .corner-brackets > span::before,
    .corner-brackets > span::after {
      content: "";
      position: absolute;
      width: 28px;
      height: 28px;
      border-color: var(--hud-green);
      filter: drop-shadow(0 0 6px var(--hud-green-glow));
    }
    .corner-brackets::before {
      top: 14px;
      left: 14px;
      border-top: 2px solid;
      border-left: 2px solid;
    }
    .corner-brackets::after {
      top: 14px;
      right: 14px;
      border-top: 2px solid;
      border-right: 2px solid;
    }
    .corner-brackets > span::before {
      bottom: 14px;
      left: 14px;
      border-bottom: 2px solid;
      border-left: 2px solid;
    }
    .corner-brackets > span::after {
      bottom: 14px;
      right: 14px;
      border-bottom: 2px solid;
      border-right: 2px solid;
    }

    /* Top status strip */
    .top-strip {
      position: fixed;
      top: 24px;
      left: 60px;
      right: 60px;
      z-index: 50;
      display: flex;
      justify-content: space-between;
      align-items: stretch;
      gap: 18px;
      padding: 0 22px;
      min-height: 62px;
      background: var(--bg-panel);
      border: 1px solid var(--hud-green-dim);
      backdrop-filter: blur(6px);
      font-family: "Orbitron", sans-serif;
      font-size: 12px;
      text-shadow: 0 0 8px var(--hud-green-glow);
    }
    .top-strip .brand {
      display: flex;
      align-items: center;
      font-weight: 900;
      font-size: 14px;
      letter-spacing: 6px;
      color: var(--hud-green);
      padding-right: 22px;
      border-right: 1px solid var(--hud-green-dim);
    }
    .top-strip .brand .accent {
      color: var(--hud-cyan);
    }

    /* Tabs */
    .tabs {
      display: flex;
      flex: 1;
      align-items: stretch;
      justify-content: center;
      gap: 0;
      overflow: hidden;
    }
    .tab {
      position: relative;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 20px;
      font-family: "Orbitron", sans-serif;
      font-weight: 700;
      font-size: 14px;
      letter-spacing: 2.8px;
      color: rgba(0, 255, 136, 0.32);
      background: transparent;
      border: 0;
      cursor: none;
      user-select: none;
      white-space: nowrap;
      transition:
        color 0.3s ease,
        background-color 0.3s ease,
        text-shadow 0.3s ease,
        box-shadow 0.3s ease,
        transform 0.3s ease;
    }
    .tab .flag {
      font-size: 22px;
      line-height: 1;
      filter: saturate(1.15);
      transition: filter 0.3s ease, transform 0.3s ease;
    }

    /* Divider between tabs */
    .tab + .tab::before {
      content: "";
      position: absolute;
      left: 0;
      top: 28%;
      bottom: 28%;
      width: 1px;
      background: var(--hud-green-dim);
      transition: opacity 0.3s ease;
    }

    .tab:hover:not(.active) {
      color: rgba(0, 255, 136, 0.9);
      background: rgba(0, 255, 136, 0.08);
      text-shadow: 0 0 6px var(--hud-green-glow);
    }
    .tab:hover .flag {
      filter: saturate(1.3) brightness(1.1);
    }

    .tab.active {
      color: var(--bg-deep);
      background: var(--hud-green);
      text-shadow: none;
      box-shadow:
        inset 0 0 0 1px rgba(255, 255, 255, 0.2),
        inset 0 -3px 0 0 rgba(0, 0, 0, 0.18),
        0 0 14px rgba(0, 255, 136, 0.55),
        0 0 32px rgba(0, 255, 136, 0.35);
    }
    .tab.active .flag {
      filter: saturate(1.4) brightness(1.05) drop-shadow(0 0 4px rgba(0,0,0,0.3));
      transform: scale(1.08);
    }
    /* Hide dividers touching the active tab */
    .tab.active::before,
    .tab.active + .tab::before {
      opacity: 0;
    }

    .top-strip .right {
      display: flex;
      gap: 18px;
      align-items: center;
      padding-left: 22px;
      border-left: 1px solid var(--hud-green-dim);
      font-family: "Share Tech Mono", monospace;
      font-size: 13px;
      letter-spacing: 2px;
    }
    .live-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 2px 10px;
      border: 1px solid var(--hud-red);
      color: var(--hud-red);
      font-family: "Orbitron", sans-serif;
      font-weight: 700;
      letter-spacing: 3px;
      text-shadow: 0 0 6px rgba(255, 51, 68, 0.7);
    }
    .live-badge::before {
      content: "";
      width: 6px;
      height: 6px;
      background: var(--hud-red);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--hud-red);
      animation: blink 1.4s ease-in-out infinite;
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.25; }
    }

    /* Bottom status bar (placeholder for STEP 6) */
    .bottom-strip {
      position: fixed;
      bottom: 24px;
      left: 60px;
      right: 60px;
      z-index: 50;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 18px;
      background: var(--bg-panel);
      border: 1px solid var(--hud-green-dim);
      backdrop-filter: blur(6px);
      font-family: "Share Tech Mono", monospace;
      font-size: 11px;
      letter-spacing: 2px;
      color: rgba(0, 255, 136, 0.7);
    }
    .bottom-strip .system-ok {
      color: var(--hud-green);
      text-shadow: 0 0 6px var(--hud-green-glow);
    }
    .bottom-strip .sep {
      margin: 0 14px;
      color: var(--hud-green-dim);
    }
  </style>
</head>
<body>
  <div id="app">
    <div id="map"></div>
  </div>

  <div class="top-strip">
    <div class="brand">RACE<span class="accent">WEATHER</span></div>
    <nav class="tabs" id="tabs"></nav>
    <div class="right">
      <span class="live-badge">LIVE</span>
      <span id="clock">--:--:--</span>
    </div>
  </div>

  <div class="bottom-strip">
    <div>
      <span class="system-ok">● SYSTEM ONLINE</span>
      <span class="sep">|</span>
      <span>MAP MODULE: ESRI WORLD IMAGERY</span>
      <span class="sep">|</span>
      <span>MARKERS: 8</span>
    </div>
    <div>
      <span>SECTOR // GLOBAL</span>
      <span class="sep">|</span>
      <span id="cursor-coord">LAT --.----  LNG --.----</span>
    </div>
  </div>

  <div class="grid-overlay"></div>
  <div class="vignette"></div>
  <div class="scanlines"></div>
  <div class="corner-brackets"><span></span></div>

  <script>
    // ===== Circuit data =====
    const CIRCUITS = [
      { id: "imola",      name: "IMOLA",      tab: "IMOLA",      full: "Autodromo Enzo e Dino Ferrari", country: "Italy",   flag: "🇮🇹", lat:  44.3439, lng:  11.7167, elev:  47 },
      { id: "spa",        name: "SPA",        tab: "SPA",        full: "Circuit de Spa-Francorchamps",   country: "Belgium", flag: "🇧🇪", lat:  50.4372, lng:   5.9714, elev: 401 },
      { id: "lemans",     name: "LE MANS",    tab: "LE MANS",    full: "Circuit de la Sarthe",           country: "France",  flag: "🇫🇷", lat:  47.9562, lng:   0.2075, elev:  62 },
      { id: "interlagos", name: "INTERLAGOS", tab: "INTERLAGOS", full: "Autódromo José Carlos Pace",     country: "Brazil",  flag: "🇧🇷", lat: -23.7036, lng: -46.6997, elev: 750 },
      { id: "cota",       name: "COTA",       tab: "COTA",       full: "Circuit of the Americas",        country: "USA",     flag: "🇺🇸", lat:  30.1328, lng: -97.6411, elev: 163 },
      { id: "fuji",       name: "FUJI",       tab: "FUJI",       full: "Fuji Speedway",                  country: "Japan",   flag: "🇯🇵", lat:  35.3725, lng: 138.9267, elev: 560 },
      { id: "lusail",     name: "LUSAIL",     tab: "QATAR",      full: "Lusail International Circuit",   country: "Qatar",   flag: "🇶🇦", lat:  25.4900, lng:  51.4543, elev:   8 },
      { id: "bahrain",    name: "BAHRAIN",    tab: "BAHRAIN",    full: "Bahrain International Circuit",  country: "Bahrain", flag: "🇧🇭", lat:  26.0325, lng:  50.5106, elev:   7 },
    ];

    const CIRCUIT_ZOOM = 14;

    // ===== Map init =====
    const map = L.map("map", {
      zoomControl: true,
      attributionControl: true,
      worldCopyJump: true,
      preferCanvas: true,
    }).setView([30, 20], 3);

    L.tileLayer(
      "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
      {
        attribution: "Tiles &copy; Esri — World Imagery",
        maxZoom: 18,
      }
    ).addTo(map);

    // Pulse marker icon
    const pulseIcon = L.divIcon({
      className: "",
      html: `
        <div class="circuit-marker">
          <div class="ring"></div>
          <div class="ring delay"></div>
          <div class="core"></div>
        </div>
      `,
      iconSize: [18, 18],
      iconAnchor: [9, 9],
    });

    // ===== Tabs + markers (shared activation) =====
    const tabsEl = document.getElementById("tabs");
    const tabNodes = new Map();
    const markerNodes = new Map();
    let activeCircuitId = null;

    function setActiveCircuit(id, { fly = true } = {}) {
      activeCircuitId = id;

      tabNodes.forEach((node, key) => {
        node.classList.toggle("active", key === id);
      });

      if (fly) {
        const c = CIRCUITS.find((x) => x.id === id);
        if (c) map.flyTo([c.lat, c.lng], CIRCUIT_ZOOM, { duration: 1.8 });
      }
    }

    CIRCUITS.forEach((c) => {
      // Tab
      const tab = document.createElement("button");
      tab.type = "button";
      tab.className = "tab";
      tab.dataset.circuit = c.id;
      tab.innerHTML = `<span class="flag">${c.flag}</span><span>${c.tab}</span>`;
      tab.addEventListener("click", () => setActiveCircuit(c.id));
      tabsEl.appendChild(tab);
      tabNodes.set(c.id, tab);

      // Marker
      const marker = L.marker([c.lat, c.lng], { icon: pulseIcon }).addTo(map);
      marker.bindTooltip(`${c.flag}  ${c.name}`, {
        className: "circuit-tooltip",
        direction: "top",
        offset: [0, -10],
        permanent: false,
      });
      marker.on("click", () => setActiveCircuit(c.id));
      markerNodes.set(c.id, marker);
    });

    // ===== Clock =====
    function updateClock() {
      const now = new Date();
      const hh = String(now.getUTCHours()).padStart(2, "0");
      const mm = String(now.getUTCMinutes()).padStart(2, "0");
      const ss = String(now.getUTCSeconds()).padStart(2, "0");
      document.getElementById("clock").textContent = `${hh}:${mm}:${ss} UTC`;
    }
    updateClock();
    setInterval(updateClock, 1000);

    // ===== Cursor coord readout =====
    const cursorEl = document.getElementById("cursor-coord");
    map.on("mousemove", (e) => {
      const lat = e.latlng.lat.toFixed(4).padStart(8);
      const lng = e.latlng.lng.toFixed(4).padStart(8);
      cursorEl.textContent = `LAT ${lat}  LNG ${lng}`;
    });
  </script>
</body>
</html>

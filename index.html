<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RaceWeather</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600;700&family=Orbitron:wght@400;500;600&display=swap"
    rel="stylesheet"
  />

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  />
  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
  ></script>

  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="map">
    <div id="bg-overlay" class="bg-overlay"></div>
  </div>

  <header class="top-bar">
    <div class="brand">Race<span class="accent">Weather</span></div>
    <nav class="tabs" id="tabs"></nav>
    <div class="right-controls">
      <span class="live-pill">Live</span>
      <span id="clock" class="clock-text">--:--:--</span>
    </div>
  </header>

  <aside id="panel-left" class="panel panel-left">
    <div class="panel-placeholder"><span class="dot"></span>Standby</div>
  </aside>

  <aside id="panel-right" class="panel panel-right">
    <div class="panel-placeholder"><span class="dot"></span>Standby</div>
  </aside>

  <footer class="bottom-bar" id="bottom-strip"></footer>

  <div class="map-controls">
    <button class="map-btn" id="zoom-in" aria-label="Zoom in" title="Zoom in">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
    </button>
    <button class="map-btn" id="zoom-out" aria-label="Zoom out" title="Zoom out">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 12h14"/></svg>
    </button>
    <button class="map-btn" id="precip-toggle" aria-label="Toggle precipitation" title="Toggle precipitation layer">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M16 13v8M8 13v8M12 15v8M20 16.58A5 5 0 0 0 18 7h-1.26A8 8 0 1 0 4 15.25"/></svg>
    </button>
  </div>

  <div id="update-toast" class="update-toast">Updated</div>

  <!-- Script load order matters: each file relies on declarations in earlier ones.
       Plain <script> tags share global scope, so functions/consts declared at top
       level in any file are accessible to the others at call time. -->
  <script src="js/config.js"></script>
  <script src="js/tracks.js"></script>
  <script src="js/weather.js"></script>
  <script src="js/map.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
